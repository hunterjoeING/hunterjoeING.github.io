name: Setup Cloudflare Turnstile

on:
  workflow_dispatch:

jobs:
  setup-turnstile:
    name: Provision Turnstile Widget & Worker Secret
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      WRANGLER_VERSION: '4.168.0'

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'

      - name: Create or Reuse Turnstile Widget & Push Worker Secret
        working-directory: cloudflare-worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_OVERRIDE: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          node -e '
          const { execFileSync } = require("child_process");

          (async () => {
            const token = process.env.CLOUDFLARE_API_TOKEN;
            if (!token) {
              console.error("ERROR: CLOUDFLARE_API_TOKEN missing.");
              process.exit(1);
            }

            const cfFetch = async (path, opts = {}) => {
              const res = await fetch("https://api.cloudflare.com/client/v4" + path, {
                ...opts,
                headers: {
                  "Authorization": "Bearer " + token,
                  "Content-Type": "application/json",
                  ...(opts.headers || {})
                }
              });
              const data = await res.json().catch(() => ({}));
              return { ok: res.ok && data.success, status: res.status, data };
            };

            let accountId = (process.env.CF_ACCOUNT_OVERRIDE || "").trim();
            if (!accountId) {
              const acc = await cfFetch("/accounts");
              if (!acc.ok || !Array.isArray(acc.data.result) || !acc.data.result.length) {
                console.error("ERROR: Could not resolve Cloudflare account (HTTP " + acc.status + ").");
                process.exit(1);
              }
              accountId = acc.data.result[0].id;
            }
            console.log("::add-mask::" + accountId);

            // 1. Check existing Turnstile widgets
            const list = await cfFetch(`/accounts/${accountId}/challenges/widgets`);
            if (!list.ok) {
              console.error("TURNSTILE_API_ERROR:", list.status, JSON.stringify(list.data?.errors || []));
              process.exit(1);
            }

            const widgets = Array.isArray(list.data.result) ? list.data.result : [];
            let widget = widgets.find(w => Array.isArray(w.domains) && w.domains.includes("hunterjoeing.github.io"));

            if (widget && widget.sitekey) {
              console.log("Found existing Turnstile widget for hunterjoeing.github.io");
              if (!widget.secret) {
                const detail = await cfFetch(`/accounts/${accountId}/challenges/widgets/${widget.sitekey}`);
                if (detail.ok && detail.data.result) widget = detail.data.result;
              }
            } else {
              console.log("Creating new Turnstile widget for hunterjoeing.github.io...");
              const created = await cfFetch(`/accounts/${accountId}/challenges/widgets`, {
                method: "POST",
                body: JSON.stringify({
                  name: "HunterJoe Arcade",
                  domains: ["hunterjoeing.github.io"],
                  mode: "managed",
                  bot_fight_mode: false
                })
              });
              if (!created.ok || !created.data.result) {
                console.error("TURNSTILE_CREATE_ERROR:", created.status, JSON.stringify(created.data?.errors || []));
                process.exit(1);
              }
              widget = created.data.result;
            }

            if (!widget?.sitekey || !widget?.secret) {
              console.error("ERROR: Turnstile widget response missing sitekey or secret.");
              process.exit(1);
            }

            // Mask secret strictly before doing anything else
            console.log("::add-mask::" + widget.secret);

            // Push secret directly to hunterjoe-scores worker via wrangler stdin
            execFileSync("npx", ["--yes", `wrangler@${process.env.WRANGLER_VERSION}`, "secret", "put", "TURNSTILE_SECRET_KEY"], {
              input: widget.secret,
              stdio: ["pipe", "inherit", "inherit"],
              env: { ...process.env, CLOUDFLARE_ACCOUNT_ID: accountId }
            });

            // Public sitekey is safe to print (embedded in client HTML/JS)
            console.log("PUBLIC_TURNSTILE_SITEKEY=" + widget.sitekey);
          })().catch(err => {
            console.error(err);
            process.exit(1);
          });
          '
