name: Deploy Cloudflare Worker

on:
  push:
    branches:
      - main
    paths:
      - 'cloudflare-worker/**'
      - '.github/workflows/deploy-worker.yml'
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy hunterjoe-scores Worker
    runs-on: ubuntu-latest
    permissions:
      contents: read

    env:
      WRANGLER_VERSION: '4.168.0'

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'

      - name: Resolve Cloudflare Account & D1 Database Binding
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_OVERRIDE: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          node -e '
          const fs = require("fs");

          (async () => {
            const token = process.env.CLOUDFLARE_API_TOKEN;
            if (!token) {
              console.error("ERROR: GitHub Secret CLOUDFLARE_API_TOKEN is missing.");
              process.exit(1);
            }

            const cfFetch = async (path) => {
              const res = await fetch("https://api.cloudflare.com/client/v4" + path, {
                headers: { "Authorization": "Bearer " + token }
              });
              const data = await res.json().catch(() => ({}));
              return { ok: res.ok && data.success, status: res.status, data };
            };

            let accountId = (process.env.CF_ACCOUNT_OVERRIDE || "").trim();
            if (!accountId) {
              const acc = await cfFetch("/accounts");
              if (!acc.ok || !Array.isArray(acc.data.result) || !acc.data.result.length) {
                console.error("ERROR: Could not list Cloudflare accounts (HTTP " + acc.status + ").");
                process.exit(1);
              }
              accountId = acc.data.result[0].id;
            }
            console.log("::add-mask::" + accountId);
            fs.appendFileSync(process.env.GITHUB_ENV, "CLOUDFLARE_ACCOUNT_ID=" + accountId + "\n");
            console.log("Resolved Cloudflare account:", Boolean(accountId));

            const tomlPath = "cloudflare-worker/wrangler.toml";
            let toml = fs.readFileSync(tomlPath, "utf8");
            if (toml.includes("REPLACE_WITH_YOUR_D1_DATABASE_ID")) {
              let dbId = "";
              let dbName = "";

              // 1. Prefer the D1 database currently bound as "DB" on the existing worker
              const settings = await cfFetch(`/accounts/${accountId}/workers/scripts/hunterjoe-scores/settings`);
              if (settings.ok && Array.isArray(settings.data.result?.bindings)) {
                const dbBinding = settings.data.result.bindings.find(b => b.type === "d1" && b.name === "DB");
                if (dbBinding && dbBinding.id) {
                  dbId = dbBinding.id;
                  console.log("::add-mask::" + dbId);
                  console.log("Found existing DB binding on hunterjoe-scores worker.");
                }
              }

              // 2. Look up D1 database list to resolve exact name/id
              const dbs = await cfFetch(`/accounts/${accountId}/d1/database`);
              const list = (dbs.ok && Array.isArray(dbs.data.result)) ? dbs.data.result : [];
              if (dbId) {
                const matched = list.find(d => d.uuid === dbId);
                if (matched) dbName = matched.name;
              } else if (list.length > 0) {
                const preferred = list.find(d => d.name === "hunterjoe-scores-db")
                  || list.find(d => /hunterjoe|score/i.test(d.name))
                  || (list.length === 1 ? list[0] : null);
                if (preferred) {
                  dbId = preferred.uuid;
                  dbName = preferred.name;
                  console.log("::add-mask::" + dbId);
                  console.log("Matched D1 database:", dbName);
                }
              }

              if (!dbId) {
                console.error("ERROR: Could not resolve D1 database_id. Ensure API token has Account D1:Read/Edit permission.");
                process.exit(1);
              }

              toml = toml.replace("REPLACE_WITH_YOUR_D1_DATABASE_ID", dbId);
              if (dbName) {
                toml = toml.replace(/database_name\s*=\s*"[^"]*"/, `database_name = "${dbName}"`);
              }
              fs.writeFileSync(tomlPath, toml, "utf8");
            }
          })().catch(err => {
            console.error(err);
            process.exit(1);
          });
          '

      - name: Deploy Worker via Wrangler
        working-directory: cloudflare-worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx --yes "wrangler@${WRANGLER_VERSION}" deploy --keep-vars

      - name: Sync & Provision Worker Secrets
        shell: bash
        working-directory: cloudflare-worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          AGENT_API_KEY: ${{ secrets.AGENT_API_KEY }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          TURNSTILE_SECRET_KEY: ${{ secrets.TURNSTILE_SECRET_KEY }}
          TELEGRAM_WEBHOOK_SECRET: ${{ secrets.TELEGRAM_WEBHOOK_SECRET }}
        run: |
          for name in TELEGRAM_BOT_TOKEN TELEGRAM_CHAT_ID AGENT_API_KEY JWT_SECRET TURNSTILE_SECRET_KEY; do
            val="${!name}"
            if [ -n "$val" ]; then
              printf '%s' "$val" | npx --yes "wrangler@${WRANGLER_VERSION}" secret put "$name"
              echo "Synced secret: $name"
            fi
          done

          # Ensure JWT_SECRET exists on the worker without rotating an already-set secret
          if [ -z "$JWT_SECRET" ]; then
            HAS_JWT=$(node -e '
              (async () => {
                const res = await fetch(`https://api.cloudflare.com/client/v4/accounts/${process.env.CLOUDFLARE_ACCOUNT_ID}/workers/scripts/hunterjoe-scores/secrets`, {
                  headers: { Authorization: "Bearer " + process.env.CLOUDFLARE_API_TOKEN }
                });
                const data = await res.json().catch(() => ({}));
                const list = Array.isArray(data.result) ? data.result : [];
                process.stdout.write(list.some(s => s.name === "JWT_SECRET") ? "yes" : "no");
              })();
            ')
            if [ "$HAS_JWT" != "yes" ]; then
              node -e 'process.stdout.write(require("crypto").randomBytes(32).toString("hex"))' | npx --yes "wrangler@${WRANGLER_VERSION}" secret put JWT_SECRET
              echo "Provisioned new JWT_SECRET on worker"
            else
              echo "Preserved existing JWT_SECRET on worker"
            fi
          fi

          # Sync or deterministically derive TELEGRAM_WEBHOOK_SECRET when Telegram is enabled
          if [ -n "$TELEGRAM_WEBHOOK_SECRET" ]; then
            printf '%s' "$TELEGRAM_WEBHOOK_SECRET" | npx --yes "wrangler@${WRANGLER_VERSION}" secret put TELEGRAM_WEBHOOK_SECRET
            echo "Synced secret: TELEGRAM_WEBHOOK_SECRET"
          elif [ -n "$TELEGRAM_BOT_TOKEN" ]; then
            node -e '
              const crypto = require("crypto");
              const sig = crypto.createHmac("sha256", process.env.TELEGRAM_BOT_TOKEN)
                .update("hunterjoe-tg-webhook-v1:" + (process.env.TELEGRAM_CHAT_ID || ""))
                .digest("hex");
              process.stdout.write(sig);
            ' | npx --yes "wrangler@${WRANGLER_VERSION}" secret put TELEGRAM_WEBHOOK_SECRET
            echo "Synced derived TELEGRAM_WEBHOOK_SECRET"
          fi

      - name: Register Telegram Webhook
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_WEBHOOK_SECRET: ${{ secrets.TELEGRAM_WEBHOOK_SECRET }}
        run: |
          if [ -n "$TELEGRAM_BOT_TOKEN" ]; then
            node -e '
            const crypto = require("crypto");
            (async () => {
              const token = process.env.TELEGRAM_BOT_TOKEN;
              const webhookSecret = (process.env.TELEGRAM_WEBHOOK_SECRET || "").trim()
                || crypto.createHmac("sha256", token)
                    .update("hunterjoe-tg-webhook-v1:" + (process.env.TELEGRAM_CHAT_ID || ""))
                    .digest("hex");
              const url = `https://api.telegram.org/bot${token}/setWebhook`;
              const res = await fetch(url, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                  url: "https://hunterjoe-scores.hunterjoeing.workers.dev/api/telegram/webhook",
                  secret_token: webhookSecret,
                  allowed_updates: ["message", "edited_message"]
                })
              });
              const data = await res.json().catch(() => ({}));
              console.log("Telegram setWebhook:", res.status, JSON.stringify({ ok: data.ok, description: data.description }));
              if (!res.ok || !data.ok) {
                throw new Error("Failed to register Telegram webhook");
              }
            })();
            '
          fi

      - name: Verify Live Worker Health
        run: |
          sleep 5
          node -e '
          (async () => {
            const res = await fetch("https://hunterjoe-scores.hunterjoeing.workers.dev/api/health");
            const data = await res.json();
            console.log("Health status:", res.status, JSON.stringify(data));
            if (!res.ok || !data.ok || data.db !== "connected" || !data.jwtConfigured || !Array.isArray(data.features) || !data.features.includes("feedback")) {
              throw new Error("Live worker health check failed after deploy");
            }
          })();
          '
