  <style>
    :root {
      --bg-dark: #070b19;
      --panel-bg: rgba(15, 23, 42, 0.82);
      --panel-border: rgba(56, 189, 248, 0.32);
      --accent: #38bdf8;

    * {

      padding: 0;

      height: 100%;

      font-family: var(--font-ui, 'Plus Jakarta Sans', system-ui, sans-serif);
    }

    #canvas-container {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
      cursor: grab;
      touch-action: none;
    }

    #canvas-container canvas {
      display: block;
      width: 100%;
      height: 100%;

    #canvas-container.dragging {

      gap: 12px;

      border-radius: 16px;
      background: var(--panel-bg);
      border: 1px solid var(--panel-border);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.45);
      pointer-events: auto;
    }

    .brand-group {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .back-link {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 8px 13px;
      border-radius: 10px;
      background: rgba(30, 41, 59, 0.85);
      border: 1px solid rgba(148, 163, 184, 0.3);
      color: var(--text-main);
      text-decoration: none;
      font-size: 13px;
      font-weight: 700;
      transition: all 0.15s ease;
    }

    .back-link:hover {
      border-color: var(--accent);
      background: rgba(14, 165, 233, 0.2);
    }

    .game-title {
      margin: 0;
      font-size: clamp(16px, 2.2vw, 21px);

      font-size: 13px;
      font-weight: 700;

      font-weight: 700;

      background: rgba(14, 165, 233, 0.22);

      color: #fff;

      border-color: #7dd3fc;
      color: #fff;

    /* Bottom HUD: Exploded View (Mousewheel Pull-Apart) & Instructions */

      position: fixed;
      bottom: 18px;
      left: 50%;
      transform: translateX(-50%);

      display: flex;
      flex-wrap: wrap;

      justify-content: center;
      gap: 16px;
      padding: 12px 20px;
      border-radius: 16px;
      background: var(--panel-bg);
      border: 1px solid var(--panel-border);

      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.48);

    .spread-control {

      gap: 10px;
      font-size: 13px;
      font-weight: 700;
      color: #e2e8f0;

    .spread-control input[type="range"] {
      width: 130px;
      accent-color: var(--accent);
      cursor: pointer;
      touch-action: pan-x;
    }

    select, .btn, .back-link {
      touch-action: manipulation;
    }

    .spread-val {
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      color: #7dd3fc;
      min-width: 44px;
    }

    .hint-bar {
      display: flex;
      align-items: center;
      gap: 14px;
      font-size: 12.5px;
      color: var(--text-muted);

    .hint-item {
      display: inline-flex;

    }

    .footer-legal-links a {
      color: #7dd3fc;
      text-decoration: none;
      font-weight: 700;
    }
    .footer-legal-links a:hover {
      text-decoration: underline;
    }

    .key-badge {
      padding: 2px 7px;
      border-radius: 6px;
      background: rgba(56, 189, 248, 0.15);
      border: 1px solid rgba(56, 189, 248, 0.35);
      color: #bae6fd;
      font-size: 11px;
      font-weight: 700;
    }

    /* Status Banner Overlay */
    .status-banner {
      position: fixed;
      top: 136px;
      left: 50%;

      z-index: 12;
      padding: 10px 20px;

      display: none;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
      text-align: center;
      gap: 10px;
      width: max-content;
      max-width: min(92vw, 780px);
    }

    .status-banner.show {
      display: inline-flex;
    }

    .status-banner.win {
      border-color: #4ade80;
      color: #86efac;
      box-shadow: 0 0 25px rgba(34, 197, 94, 0.35);
    }

    .status-banner.lose {
      border-color: #fb7185;
      color: #fda4af;
      box-shadow: 0 0 25px rgba(244, 63, 94, 0.35);
    }

    #coord-readout {
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      color: #cbd5e1;
      font-size: 12.5px;
    }

    html[data-theme="light"] {
      --bg-dark: #F6F8FC;

    }
    html[data-theme="light"] .stat-pill {

    }
    html[data-theme="light"] select,
    html[data-theme="light"] .btn {
      background: #FFFFFF;

    html[data-theme="light"] select:hover,
    html[data-theme="light"] .btn:hover {

    html[data-theme="light"] .btn.primary {

    html[data-theme="light"] .btn.primary:hover {

    /* Reversible Per-Block Hide Mode & Ghost Toolbar */
    #canvas-container.hide-cursor { cursor: crosshair; }

    .btn.active-hide {
      background: linear-gradient(135deg, #0284c7, #0ea5e9);
      border-color: #7dd3fc;
      color: #ffffff;
      box-shadow: 0 0 16px rgba(56, 189, 248, 0.45);
    }
    .btn.has-hidden:not(.active-hide) {
      border-color: rgba(251, 191, 36, 0.78);
      color: #fde68a;

    html[data-theme="light"] .btn.active-hide {

    .hide-badge {
      display: inline-flex;

    .hb-count {

  <div id="canvas-container"></div>

  <header class="top-bar">
    <div class="brand-group">
      <a class="back-link" href="../../index.html">← Dashboard</a>
      <h1 class="game-title">Minesweeper 3d prompt Version</h1>
      <a class="back-link" href="../../Nachweis_Minesweeper_3D_Prompt_Test.pdf" target="_blank" rel="noopener" title="Unabhängigkeits-Nachweis als PDF öffnen">📄 Nachweis-PDF</a>
    </div>

    <div class="stats-group">
      <div class="stat-pill" title="Verbleibende Minen">
        <span>💣 Minen:</span>
        <b id="stat-mines">10</b>
      </div>
      <div class="stat-pill" title="Verbleibende sichere Felder">
        <span>🧊 Offen:</span>
        <b id="stat-safe">54</b>
      </div>
      <div class="stat-pill" title="Spielzeit">
        <span>⏱️ Zeit:</span>
        <b id="stat-time">0s</b>
      </div>
      <div class="stat-pill" id="coord-readout">XYZ: –</div>
    </div>

    <div class="controls-group">
      <select id="select-difficulty" aria-label="Würfelgröße wählen">
        <option value="3-5">3×3×3 Würfel (5 Minen)</option>
        <option value="4-10" selected>4×4×4 Würfel (10 Minen)</option>
        <option value="5-20">5×5×5 Würfel (20 Minen)</option>
      </select>
      <button class="btn" id="btn-flag-mode" title="Umschalten zwischen Aufdecken und Flagge setzen">🚩 Flaggen-Modus: AUS</button>
      <button class="btn" id="btn-hide-mode" title="Blöcke einzeln ausblenden / wiederherstellen (Taste H · oder Alt+Klick)">👁️‍🗨️ Verbergen: AUS<span class="hide-badge hidden" id="hide-count-badge">0</span></button>

  <script src="../../shared/arcade.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script>
    (function () {
      // =========================================================================
      // Minesweeper 3d prompt test — Standalone 3D Cube Minesweeper
      // =========================================================================
      const container = document.getElementById('canvas-container');
      const elMines = document.getElementById('stat-mines');
      const elSafe = document.getElementById('stat-safe');
      const elTime = document.getElementById('stat-time');
      const elCoord = document.getElementById('coord-readout');
      const elDifficulty = document.getElementById('select-difficulty');
      const elFlagBtn = document.getElementById('btn-flag-mode');
      const elHideBtn = document.getElementById('btn-hide-mode');
      const elHideBadge = document.getElementById('hide-count-badge');
      const elHideBar = document.getElementById('hide-bar');
      const elHideBarCount = document.getElementById('hide-bar-count');
      const elHideUndoBtn = document.getElementById('btn-hide-undo');
      const elHideGhostBtn = document.getElementById('btn-hide-ghost');
      const elHideRestoreBtn = document.getElementById('btn-hide-restore-all');
      const elHideDoneBtn = document.getElementById('btn-hide-done');
      const elBottomHud = document.querySelector('.bottom-hud');
      const elNewGameBtn = document.getElementById('btn-new-game');
      const elBanner = document.getElementById('status-banner');
      const elBannerText = document.getElementById('status-text');
      const elBannerRestart = document.getElementById('btn-banner-restart');
      const elSpreadSlider = document.getElementById('slider-spread');
      const elSpreadLabel = document.getElementById('spread-label');
      const elResetViewBtn = document.getElementById('btn-reset-view');

      const elThemeBtn = document.getElementById('btn-theme-toggle');
      let currentTheme = (function () {
        try {
          return localStorage.getItem('arcade_theme') === 'dark' ? 'dark' : 'light';
        } catch (_) {
          return 'light';
        }
      })();
      function isLightTheme() {
        return currentTheme === 'light';
      }

      // Scene, Camera, Renderer
      const scene = new THREE.Scene();
      const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 200);
      camera.position.set(0, 0, 14);

      const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
      container.appendChild(renderer.domElement);

      // Lighting
      const ambientLight = new THREE.AmbientLight(0xdbeafe, 0.72);
      scene.add(ambientLight);

      const dirLight1 = new THREE.DirectionalLight(0xffffff, 0.85);
      dirLight1.position.set(12, 18, 16);
      scene.add(dirLight1);

      const dirLight2 = new THREE.DirectionalLight(0x38bdf8, 0.4);
      dirLight2.position.set(-14, -12, -10);
      scene.add(dirLight2);

      // Root pivot group that the user rotates with the mouse
      const cubePivot = new THREE.Group();
      cubePivot.rotation.x = 0.48;
      cubePivot.rotation.y = -0.62;
      scene.add(cubePivot);

      // Subtle guide wireframe around the outer bounds
      let coreGuideMesh = null;

      // Game state
      let gridSize = 4;
      let totalMines = 10;
      let cells = []; // 1D array of cell objects
      let cellMap = new Map(); // "x,y,z" -> cell
      let pickableMeshes = []; // Meshes for raycasting
      let firstClick = true;
      let gameOver = false;
      let gameLost = false;
      let flagMode = false;
      let hideMode = false;
      let ghostMode = false;
      let altKeyHeld = false;
      let hideBarDismissed = false;
      let hiddenHistory = [];
      let hiddenCount = 0;
      let lastHideOpTime = 0;
      let hoveredCell = null;
      let hoveredPrevMeshMat = null;
      let hoveredPrevWireMat = null;
      let flagsCount = 0;
      let revealedCount = 0;
      let startTime = 0;
      let timerInterval = null;

      // Explosion / pull-apart state controlled via mouse wheel
      let targetSpread = 1.15;
      let currentSpread = 1.15;
      const MIN_SPREAD = 1.0;
      const MAX_SPREAD = 3.2;

      // Shared geometries & materials
      const boxGeo = new THREE.BoxGeometry(0.84, 0.84, 0.84);
      const edgesGeo = new THREE.EdgesGeometry(boxGeo);
      const revealedFrameGeo = new THREE.BoxGeometry(0.28, 0.28, 0.28);
      const mineSphereGeo = new THREE.SphereGeometry(0.32, 20, 20);

      const matUnrevealed = new THREE.MeshStandardMaterial({
        color: 0x1e3a5f,
        roughness: 0.28,
        metalness: 0.18,
        transparent: true,
        opacity: 0.94
      });

      const matHover = new THREE.MeshStandardMaterial({
        color: 0x38bdf8,
        emissive: 0x0284c7,
        emissiveIntensity: 0.35,
        roughness: 0.2,
        metalness: 0.2,
        transparent: true,
        opacity: 0.98
      });

      const matFlagged = new THREE.MeshStandardMaterial({
        color: 0xe11d48,
        emissive: 0x881337,
        emissiveIntensity: 0.35,
        roughness: 0.25,
        metalness: 0.2
      });

      const matFlagCorrect = new THREE.MeshStandardMaterial({
        color: 0x16a34a,
        emissive: 0x14532d,
        emissiveIntensity: 0.45,
        roughness: 0.25,
        metalness: 0.2
      });

      const matFlagWrong = new THREE.MeshStandardMaterial({
        color: 0xd97706,
        emissive: 0x7c2d12,
        emissiveIntensity: 0.42,
        roughness: 0.25,
        metalness: 0.2
      });

      const matMine = new THREE.MeshStandardMaterial({
        color: 0xef4444,
        emissive: 0x991b1b,
        emissiveIntensity: 0.5,
        roughness: 0.25,
        metalness: 0.4
      });

      const matNumberGlass = new THREE.MeshStandardMaterial({
        color: 0x0f172a,
        roughness: 0.15,
        metalness: 0.1,
        transparent: true,
        opacity: 0.34,
        depthWrite: false
      });

      const matGhost = new THREE.MeshStandardMaterial({
        color: 0x38bdf8,
        emissive: 0x0284c7,
        emissiveIntensity: 0.25,
        roughness: 0.2,
        metalness: 0.1,
        transparent: true,
        opacity: 0.24,
        depthWrite: false
      });

      const lineMatDefault = new THREE.LineBasicMaterial({
        color: 0x7dd3fc,
        transparent: true,
        opacity: 0.42
      });

      const lineMatGhost = new THREE.LineBasicMaterial({
        color: 0x7dd3fc,
        transparent: true,
        opacity: 0.78
      });

      const lineMatGhostHover = new THREE.LineBasicMaterial({
        color: 0xfde047,
        transparent: true,
        opacity: 0.96
      });

      const lineMatCorrect = new THREE.LineBasicMaterial({
        color: 0x86efac,
        transparent: true,
        opacity: 0.78
      });

      const lineMatWrong = new THREE.LineBasicMaterial({
        color: 0xfdba74,
        transparent: true,
        opacity: 0.78
      });

      // Number color palette (dark vs. light high-contrast)
      const NUMBER_COLORS_DARK = [
        '#94a3b8', // 0
        '#38bdf8', // 1 - sky blue
        '#4ade80', // 2 - green
        '#facc15', // 3 - yellow
        '#fb923c', // 4 - orange
        '#f43f5e', // 5 - rose
        '#c084fc', // 6 - purple
        '#2dd4bf', // 7 - teal
        '#f472b6', // 8 - pink
        '#ffffff'  // 9+
      ];
      const NUMBER_COLORS_LIGHT = [
        '#64748b', // 0
        '#0284c7', // 1 - deep azure
        '#15803d', // 2 - forest green
        '#b45309', // 3 - warm amber
        '#c2410c', // 4 - burnt orange
        '#be123c', // 5 - crimson
        '#7e22ce', // 6 - deep violet
        '#0f766e', // 7 - deep teal
        '#be185d', // 8 - magenta
        '#0f172a'  // 9+
      ];
      function getNumberPalette() {
        return isLightTheme() ? NUMBER_COLORS_LIGHT : NUMBER_COLORS_DARK;
      }

      const spriteMaterialCache = new Map();

      function getTextSpriteMaterial(label, colorHex) {
        const light = isLightTheme();
        const key = (light ? 'L_' : 'D_') + label + '_' + colorHex;
        if (spriteMaterialCache.has(key)) return spriteMaterialCache.get(key);

        const canvas = document.createElement('canvas');
        canvas.width = 128;
        canvas.height = 128;
        const ctx = canvas.getContext('2d');

        // High-contrast circular pill badge behind number/icon for legibility
        ctx.beginPath();
        ctx.arc(64, 64, 48, 0, Math.PI * 2);
        ctx.fillStyle = light ? 'rgba(255, 255, 255, 0.94)' : 'rgba(7, 11, 25, 0.78)';
        ctx.fill();
        ctx.lineWidth = light ? 5 : 4;
        ctx.strokeStyle = colorHex;
        ctx.stroke();

        ctx.fillStyle = colorHex;
        ctx.font = '900 64px system-ui, -apple-system, sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(String(label), 64, 67);

        const texture = new THREE.CanvasTexture(canvas);
        texture.needsUpdate = true;
        const mat = new THREE.SpriteMaterial({
          map: texture,
          transparent: true,
          depthTest: true,
          depthWrite: false
        });
        spriteMaterialCache.set(key, mat);
        return mat;
      }

      function getFlagOutcomeSpriteMaterial(hadMine) {
        const light = isLightTheme();
        const key = (light ? 'L_' : 'D_') + (hadMine ? 'outcome_flag_hit' : 'outcome_flag_wrong');
        if (spriteMaterialCache.has(key)) return spriteMaterialCache.get(key);

        const canvas = document.createElement('canvas');
        canvas.width = 128;
        canvas.height = 128;
        const ctx = canvas.getContext('2d');

        ctx.beginPath();
        ctx.arc(64, 64, 52, 0, Math.PI * 2);
        ctx.fillStyle = light
          ? (hadMine ? 'rgba(240, 253, 244, 0.96)' : 'rgba(255, 247, 237, 0.96)')
          : (hadMine ? 'rgba(5, 46, 22, 0.88)' : 'rgba(40, 14, 8, 0.88)');
        ctx.fill();
        ctx.lineWidth = 5;
        ctx.strokeStyle = hadMine ? (light ? '#16a34a' : '#4ade80') : (light ? '#ea580c' : '#fb923c');
        ctx.stroke();

        if (hadMine) {
          const cx = 56, cy = 70, r = 20, spike = 32;
          ctx.strokeStyle = light ? '#0f172a' : '#f8fafc';
          ctx.lineWidth = 4.5;
          ctx.lineCap = 'round';
          for (let a = 0; a < 8; a++) {
            const ang = (a / 8) * Math.PI * 2;
            ctx.beginPath();
            ctx.moveTo(cx + Math.cos(ang) * r, cy + Math.sin(ang) * r);
            ctx.lineTo(cx + Math.cos(ang) * spike, cy + Math.sin(ang) * spike);
            ctx.stroke();
          }
          ctx.beginPath();
          ctx.arc(cx, cy, r, 0, Math.PI * 2);
          ctx.fillStyle = '#0f172a';
          ctx.fill();
          ctx.beginPath();
          ctx.arc(cx - 6, cy - 6, 6, 0, Math.PI * 2);
          ctx.fillStyle = 'rgba(255,255,255,0.85)';
          ctx.fill();

          ctx.beginPath();
          ctx.arc(92, 36, 20, 0, Math.PI * 2);
          ctx.fillStyle = '#22c55e';
          ctx.fill();
          ctx.lineWidth = 3.5;
          ctx.strokeStyle = '#ffffff';
          ctx.stroke();

          ctx.beginPath();
          ctx.moveTo(81, 37);
          ctx.lineTo(89, 45);
          ctx.lineTo(103, 27);
          ctx.lineWidth = 5.5;
          ctx.lineCap = 'round';
          ctx.lineJoin = 'round';
          ctx.strokeStyle = '#ffffff';
          ctx.stroke();
        } else {
          ctx.strokeStyle = light ? '#334155' : '#e2e8f0';
          ctx.lineWidth = 6;
          ctx.lineCap = 'round';
          ctx.beginPath();
          ctx.moveTo(46, 30);
          ctx.lineTo(46, 98);
          ctx.stroke();

          ctx.beginPath();
          ctx.moveTo(48, 30);
          ctx.lineTo(94, 46);
          ctx.lineTo(48, 64);
          ctx.closePath();
          ctx.fillStyle = '#f59e0b';
          ctx.fill();

          const drawCross = (w, col) => {
            ctx.beginPath();
            ctx.moveTo(32, 32);
            ctx.lineTo(96, 96);
            ctx.moveTo(96, 32);
            ctx.lineTo(32, 96);
            ctx.lineWidth = w;
            ctx.lineCap = 'round';
            ctx.strokeStyle = col;
            ctx.stroke();
          };
          drawCross(15, '#ffffff');
          drawCross(9, '#ef4444');
        }

        const texture = new THREE.CanvasTexture(canvas);
        texture.needsUpdate = true;
        const mat = new THREE.SpriteMaterial({
          map: texture,
          transparent: true,
          depthTest: true,
          depthWrite: false
        });
        spriteMaterialCache.set(key, mat);
        return mat;
      }

      function applySceneTheme(themeName) {
        currentTheme = themeName === 'light' ? 'light' : 'dark';
        if (currentTheme === 'light') {
          document.documentElement.setAttribute('data-theme', 'light');
        } else {
          document.documentElement.removeAttribute('data-theme');
        }
        try { localStorage.setItem('arcade_theme', currentTheme); } catch (_) {}

        const light = isLightTheme();
        if (elThemeBtn) {
          elThemeBtn.textContent = light ? '🌙' : '☀️';
          elThemeBtn.title = light ? 'Zum Dunkel-Modus wechseln' : 'Zum Hell-Modus wechseln';
        }

        ambientLight.color.setHex(light ? 0xffffff : 0xdbeafe);
        ambientLight.intensity = light ? 0.98 : 0.72;
        dirLight1.intensity = light ? 1.0 : 0.85;
        dirLight2.color.setHex(light ? 0x0284c7 : 0x38bdf8);
        dirLight2.intensity = light ? 0.35 : 0.4;

        matUnrevealed.color.setHex(light ? 0x2563eb : 0x1e3a5f);
        matUnrevealed.roughness = light ? 0.32 : 0.28;
        matUnrevealed.opacity = light ? 0.92 : 0.94;
        matHover.color.setHex(light ? 0x0ea5e9 : 0x38bdf8);
        matNumberGlass.color.setHex(light ? 0xcbd5e1 : 0x0f172a);
        matNumberGlass.opacity = light ? 0.42 : 0.34;
        lineMatDefault.color.setHex(light ? 0x0369a1 : 0x7dd3fc);
        lineMatDefault.opacity = light ? 0.58 : 0.42;

        matGhost.color.setHex(light ? 0x0284c7 : 0x38bdf8);
        matGhost.emissive.setHex(light ? 0x0369a1 : 0x0284c7);
        matGhost.opacity = light ? 0.30 : 0.24;
        lineMatGhost.color.setHex(light ? 0x0369a1 : 0x7dd3fc);
        lineMatGhost.opacity = light ? 0.85 : 0.78;
        lineMatGhostHover.color.setHex(light ? 0xd97706 : 0xfde047);

        if (cells.length) {
          cells.forEach(setCellVisual);
        }
        if (typeof updateHideBarPosition === 'function') {
          updateHideBarPosition();
        }
      }

      function coordKey(x, y, z) {
        return `${x},${y},${z}`;
      }

      function getNeighbors(cell) {
        const result = [];
        for (let dx = -1; dx <= 1; dx++) {
          for (let dy = -1; dy <= 1; dy++) {
            for (let dz = -1; dz <= 1; dz++) {
              if (dx === 0 && dy === 0 && dz === 0) continue;
              const nb = cellMap.get(coordKey(cell.x + dx, cell.y + dy, cell.z + dz));
              if (nb) result.push(nb);
            }
          }
        }
        return result;
      }

      function clearCubeGroup() {
        while (cubePivot.children.length > 0) {
          cubePivot.remove(cubePivot.children[0]);
        }
        cells = [];
        cellMap.clear();
        pickableMeshes = [];
      }

      function updateCameraDistance() {
        const aspect = camera.aspect || (window.innerWidth / window.innerHeight) || 1;
        const aspectFactor = aspect < 1 ? Math.min(1.9, 0.9 / Math.max(0.45, aspect)) : 1;
        const baseDist = (gridSize * 3.0 + 2.8) * aspectFactor;
        const spreadPullback = Math.max(0, currentSpread - 1.15) * gridSize * 0.68 * (aspect < 1 ? 1.15 : 1);
        camera.position.set(0, 0, baseDist + spreadPullback);
      }

      function initGame() {
        if (timerInterval) {
          clearInterval(timerInterval);
          timerInterval = null;
        }

        const [sizeStr, minesStr] = elDifficulty.value.split('-');
        gridSize = parseInt(sizeStr, 10);
        totalMines = parseInt(minesStr, 10);

        firstClick = true;
        gameOver = false;
        gameLost = false;
        hideMode = false;
        ghostMode = false;
        hideBarDismissed = false;
        hiddenHistory = [];
        hiddenCount = 0;
        flagsCount = 0;
        revealedCount = 0;
        startTime = 0;
        hoveredCell = null;
        hoveredPrevMeshMat = null;
        hoveredPrevWireMat = null;
        elTime.textContent = '0s';
        elBanner.className = 'status-banner';

        clearCubeGroup();
        updateCameraDistance();

        const offset = (gridSize - 1) / 2;

        for (let x = 0; x < gridSize; x++) {
          for (let y = 0; y < gridSize; y++) {
            for (let z = 0; z < gridSize; z++) {
              const bx = x - offset;
              const by = y - offset;
              const bz = z - offset;

              const cellGroup = new THREE.Group();
              cellGroup.position.set(bx * currentSpread, by * currentSpread, bz * currentSpread);

              const mesh = new THREE.Mesh(boxGeo, matUnrevealed.clone());
              const wireframe = new THREE.LineSegments(edgesGeo, lineMatDefault);
              mesh.add(wireframe);
              cellGroup.add(mesh);

              const cell = {
                x, y, z,
                bx, by, bz,
                isMine: false,
                revealed: false,
                flagged: false,
                userHidden: false,
                neighborMines: 0,
                group: cellGroup,
                mesh,
                wireframe,
                sprite: null
              };

              mesh.userData.cell = cell;
              cubePivot.add(cellGroup);
              cells.push(cell);
              cellMap.set(coordKey(x, y, z), cell);
              pickableMeshes.push(mesh);
            }
          }
        }

        updateStatsHUD();
        syncHideUI();
      }

      function placeMines(safeCell) {
        // Exclude clicked cell and its direct 26-neighbors if enough cells exist
        const forbidden = new Set([coordKey(safeCell.x, safeCell.y, safeCell.z)]);
        const safeNeighbors = getNeighbors(safeCell);
        if (cells.length - (1 + safeNeighbors.length) >= totalMines) {
          safeNeighbors.forEach(nb => forbidden.add(coordKey(nb.x, nb.y, nb.z)));
        }

        const candidates = cells.filter(c => !forbidden.has(coordKey(c.x, c.y, c.z)));
        for (let i = candidates.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          const tmp = candidates[i];
          candidates[i] = candidates[j];
          candidates[j] = tmp;
        }

        for (let i = 0; i < totalMines && i < candidates.length; i++) {
          candidates[i].isMine = true;
        }

        cells.forEach(c => {
          if (!c.isMine) {
            c.neighborMines = getNeighbors(c).filter(nb => nb.isMine).length;
          }
        });
      }

      function startTimer() {
        startTime = Date.now();
        timerInterval = setInterval(() => {
          const sec = Math.floor((Date.now() - startTime) / 1000);
          elTime.textContent = sec + 's';
        }, 250);
      }

      function updateStatsHUD() {
        elMines.textContent = String(Math.max(0, totalMines - flagsCount));
        const totalSafe = cells.length - totalMines;
        elSafe.textContent = String(Math.max(0, totalSafe - revealedCount));
      }

      function updateHideBarPosition() {
        if (!elHideBar || !elBottomHud) return;
        const rect = elBottomHud.getBoundingClientRect();
        if (rect.top > 0) {
          elHideBar.style.bottom = `${Math.ceil(window.innerHeight - rect.top + 10)}px`;
        }
      }

      function syncHideUI() {
        if (elHideBtn) {
          elHideBtn.classList.toggle('active-hide', hideMode);
          elHideBtn.classList.toggle('has-hidden', hiddenCount > 0);
          if (elHideBtn.firstChild && elHideBtn.firstChild.nodeType === 3) {
            elHideBtn.firstChild.nodeValue = hideMode ? '👁️‍🗨️ Verbergen: AN' : '👁️‍🗨️ Verbergen: AUS';
          }
        }
        if (elHideBadge) {
          elHideBadge.textContent = String(hiddenCount);
          elHideBadge.classList.toggle('hidden', hiddenCount === 0);
        }
        if (container) {
          container.classList.toggle('hide-cursor', !gameOver && (hideMode || altKeyHeld) && !ghostMode);
          container.classList.toggle('ghost-cursor', !gameOver && ghostMode && hiddenCount > 0);
        }
        if (elHideBar) {
          const showBar = !gameOver && (hideMode || ghostMode || (hiddenCount > 0 && !hideBarDismissed));
          elHideBar.classList.toggle('hidden', !showBar);
          elHideBar.classList.toggle('mode-on', hideMode);
        }
        if (elHideBarCount) {
          elHideBarCount.textContent = hiddenCount === 1 ? '1 verborgen' : `${hiddenCount} verborgen`;
        }
        if (elHideUndoBtn) elHideUndoBtn.disabled = hiddenHistory.length === 0;
        if (elHideGhostBtn) {
          elHideGhostBtn.disabled = hiddenCount === 0;
          elHideGhostBtn.classList.toggle('active-ghost', ghostMode && hiddenCount > 0);
        }
        if (elHideRestoreBtn) elHideRestoreBtn.disabled = hiddenCount === 0;
        if (elHideBar && !elHideBar.classList.contains('hidden')) {
          updateHideBarPosition();
        }
      }

      function setHideMode(enabled) {
        const next = Boolean(enabled) && !gameOver;
        if (next === hideMode) {
          syncHideUI();
          return;
        }
        hideMode = next;
        if (hideMode) {
          hideBarDismissed = false;
          if (flagMode) {
            flagMode = false;
            elFlagBtn.classList.remove('active-mode');
            elFlagBtn.textContent = '🚩 Flaggen-Modus: AUS';
          }
        }
        clearHover();
        syncHideUI();
      }

      function hideCell(cell) {
        if (!cell || gameOver || cell.userHidden) return false;
        if (cell.revealed && !cell.isMine && cell.neighborMines === 0) return false;
        cell.userHidden = true;
        hiddenCount++;
        hiddenHistory.push(cell);
        hideBarDismissed = false;
        lastHideOpTime = Date.now();
        clearHover();
        setCellVisual(cell);
        syncHideUI();
        return true;
      }

      function unhideCell(cell) {
        if (!cell || !cell.userHidden) return false;
        cell.userHidden = false;
        hiddenCount = Math.max(0, hiddenCount - 1);
        hiddenHistory = hiddenHistory.filter(c => c !== cell);
        if (hiddenCount === 0) {
          ghostMode = false;
        }
        lastHideOpTime = Date.now();
        clearHover();
        setCellVisual(cell);
        syncHideUI();
        return true;
      }

      function undoHide() {
        while (hiddenHistory.length > 0) {
          const lastCell = hiddenHistory.pop();
          if (lastCell && lastCell.userHidden) {
            lastCell.userHidden = false;
            hiddenCount = Math.max(0, hiddenCount - 1);
            if (hiddenCount === 0) {
              ghostMode = false;
            }
            lastHideOpTime = Date.now();
            clearHover();
            setCellVisual(lastCell);
            syncHideUI();
            return true;
          }
        }
        syncHideUI();
        return false;
      }

      function toggleGhostMode() {
        if (hiddenCount === 0 && !ghostMode) return;
        ghostMode = !ghostMode;
        clearHover();
        cells.forEach(c => {
          if (c.userHidden) setCellVisual(c);
        });
        syncHideUI();
      }

      function restoreAllHidden(silent) {
        if (hiddenCount === 0 && !ghostMode) {
          if (!silent) syncHideUI();
          return;
        }
        const hadHidden = hiddenCount > 0;
        ghostMode = false;
        hiddenHistory = [];
        hiddenCount = 0;
        hideBarDismissed = false;
        clearHover();
        cells.forEach(c => {
          if (c.userHidden) {
            c.userHidden = false;
            setCellVisual(c);
          }
        });
        if (hadHidden) {
          lastHideOpTime = Date.now();
        }
        if (!silent) syncHideUI();
      }

      function setCellVisual(cell) {
        // Remove previous sprite if any
        if (cell.sprite) {
          cell.group.remove(cell.sprite);
          cell.sprite = null;
        }

        if (cell.userHidden) {
          if (ghostMode) {
            cell.mesh.visible = true;
            cell.mesh.geometry = boxGeo;
            cell.mesh.material = matGhost;
            cell.wireframe.visible = true;
            cell.wireframe.material = lineMatGhost;
          } else {
            cell.mesh.visible = false;
            cell.wireframe.visible = false;
          }
          return;
        }

        if (!cell.revealed) {
          cell.mesh.visible = true;
          cell.mesh.geometry = boxGeo;
          cell.wireframe.visible = true;
          if (cell.flagged) {
            if (gameLost) {
              cell.mesh.material = cell.isMine ? matFlagCorrect : matFlagWrong;
              cell.wireframe.material = cell.isMine ? lineMatCorrect : lineMatWrong;
              const outcomeMat = getFlagOutcomeSpriteMaterial(cell.isMine);
              const sp = new THREE.Sprite(outcomeMat);
              sp.scale.set(0.76, 0.76, 0.76);
              cell.group.add(sp);
              cell.sprite = sp;
            } else {
              cell.mesh.material = matFlagged;
              cell.wireframe.material = lineMatDefault;
              const flagSpriteMat = getTextSpriteMaterial('🚩', isLightTheme() ? '#e11d48' : '#fda4af');
              const sp = new THREE.Sprite(flagSpriteMat);
              sp.scale.set(0.68, 0.68, 0.68);
              cell.group.add(sp);
              cell.sprite = sp;
            }
          } else {
            cell.wireframe.material = lineMatDefault;
            cell.mesh.material = matUnrevealed.clone();
          }
          return;
        }

        // Cell is revealed
        if (cell.isMine) {
          cell.mesh.visible = true;
          cell.mesh.geometry = mineSphereGeo;
          cell.mesh.material = matMine;
          cell.wireframe.visible = false;
          const mineSpriteMat = getTextSpriteMaterial('💣', isLightTheme() ? '#b91c1c' : '#ef4444');
          const sp = new THREE.Sprite(mineSpriteMat);
          sp.scale.set(0.85, 0.85, 0.85);
          cell.group.add(sp);
          cell.sprite = sp;
          return;
        }

        if (cell.neighborMines === 0) {
          // Completely empty cell: hide mesh so player can see deep inside the cube
          cell.mesh.visible = false;
        } else {
          // Show translucent mini-cube + crisp 3D billboard number sprite
          cell.mesh.visible = true;
          cell.mesh.geometry = revealedFrameGeo;
          cell.mesh.material = matNumberGlass;
          cell.wireframe.visible = false;

          const palette = getNumberPalette();
          const color = palette[Math.min(cell.neighborMines, palette.length - 1)];
          const numMat = getTextSpriteMaterial(String(cell.neighborMines), color);
          const sp = new THREE.Sprite(numMat);
          sp.userData.cell = cell;
          sp.scale.set(0.76, 0.76, 0.76);
          cell.group.add(sp);
          cell.sprite = sp;
        }
      }

      function revealCell(startCell) {
        if (gameOver || startCell.revealed || startCell.flagged || startCell.userHidden) return;

        if (firstClick) {
          firstClick = false;
          placeMines(startCell);
          startTimer();
        }

        if (startCell.isMine) {
          startCell.revealed = true;
          setCellVisual(startCell);
          triggerGameOver(false);
          return;
        }

        let unhidByReveal = false;
        // BFS flood-fill for 0-mine cells in 3D
        const queue = [startCell];
        while (queue.length > 0) {
          const curr = queue.shift();
          if (curr.revealed || curr.isMine) continue;

          if (curr.flagged) {
            curr.flagged = false;
            flagsCount--;
          }
          if (curr.userHidden) {
            curr.userHidden = false;
            hiddenCount = Math.max(0, hiddenCount - 1);
            hiddenHistory = hiddenHistory.filter(c => c !== curr);
            unhidByReveal = true;
          }

          curr.revealed = true;
          revealedCount++;
          setCellVisual(curr);

          if (curr.neighborMines === 0) {
            const neighbors = getNeighbors(curr);
            for (const nb of neighbors) {
              if (!nb.revealed && !nb.isMine) {
                queue.push(nb);
              }
            }
          }
        }

        if (unhidByReveal) {
          if (hiddenCount === 0) ghostMode = false;
          syncHideUI();
        }

        updateStatsHUD();

        if (revealedCount >= cells.length - totalMines) {
          triggerGameOver(true);
        }
      }

      function toggleFlag(cell) {
        if (gameOver || cell.revealed || cell.userHidden) return;
        cell.flagged = !cell.flagged;
        flagsCount += cell.flagged ? 1 : -1;
        setCellVisual(cell);
        updateStatsHUD();
      }

      const topBarEl = document.querySelector('.top-bar');
      function updateBannerPosition() {
        if (!elBanner || !topBarEl) return;
        const rect = topBarEl.getBoundingClientRect();
        if (rect.bottom > 0) {
          elBanner.style.top = `${Math.ceil(rect.bottom + 10)}px`;
        }
      }

      function triggerGameOver(won) {
        gameOver = true;
        if (timerInterval) {
          clearInterval(timerInterval);
          timerInterval = null;
        }
        setHideMode(false);
        restoreAllHidden(false);

        if (!won) {
          gameLost = true;
          let correctFlags = 0;
          let wrongFlags = 0;
          let missedMines = 0;
          cells.forEach(c => {
            if (c.flagged) {
              if (c.isMine) correctFlags++;
              else wrongFlags++;
              setCellVisual(c);
            } else if (c.isMine) {
              missedMines++;
              if (!c.revealed) {
                c.revealed = true;
                setCellVisual(c);
              }
            }
          });
          elBanner.className = 'status-banner show lose';
          elBannerText.textContent =
            `💥 Mine getroffen! 🟢✓ Flagge = Mine (${correctFlags}) · 🟠✕ Keine Mine (${wrongFlags}) · 💣 Übersehen (${missedMines})`;
        } else {
          const elapsedSec = startTime ? Math.max(0, Math.floor((Date.now() - startTime) / 1000)) : 0;
          elTime.textContent = elapsedSec + 's';
          if (window.ArcadeScores && typeof window.ArcadeScores.record === 'function') {
            const label = `${elapsedSec}s · ${gridSize}³ (${totalMines} Minen)`;
            window.ArcadeScores.record('minesweeper_3d_prompt_test', elapsedSec, label, true, {
              meta: { gridSize, totalMines }
            });
          }
          elBanner.className = 'status-banner show win';
          elBannerText.textContent = `🏆 Gelöst! Alle sicheren Felder in ${elTime.textContent} aufgedeckt!`;
        }
        updateBannerPosition();
      }

      // =========================================================================
      // Mouse & Touch Rotation, 2-Finger Pinch / Mousewheel Pull-Apart, Raycasting
      // =========================================================================
      const raycaster = new THREE.Raycaster();
      const mouse = new THREE.Vector2();
      const worldAxisY = new THREE.Vector3(0, 1, 0);
      const worldAxisX = new THREE.Vector3(1, 0, 0);
      const rotQuatY = new THREE.Quaternion();
      const rotQuatX = new THREE.Quaternion();

      function rotateCube(dx, dy, speed) {
        rotQuatY.setFromAxisAngle(worldAxisY, dx * speed);
        rotQuatX.setFromAxisAngle(worldAxisX, dy * speed);
        cubePivot.quaternion.premultiply(rotQuatY);
        cubePivot.quaternion.premultiply(rotQuatX);
        cubePivot.quaternion.normalize();
      }

      let isPointerDown = false;
      let activePointerId = null;
      let downButton = 0;
      let prevX = 0;
      let prevY = 0;
      let draggedDistance = 0;

      // Mobile touch state
      let touchMode = 'none'; // 'none' | 'single' | 'pinch'
      let wasMultiTouch = false;
      let touchPrevX = 0;
      let touchPrevY = 0;
      let touchDraggedDist = 0;
      let prevPinchDist = null;

      function updateMouseNormalized(clientX, clientY) {
        mouse.x = (clientX / window.innerWidth) * 2 - 1;
        mouse.y = -(clientY / window.innerHeight) * 2 + 1;
      }

      function getIntersectedCell(clientX, clientY, includeRevealed) {
        updateMouseNormalized(clientX, clientY);
        raycaster.setFromCamera(mouse, camera);
        const targets = [];
        for (let i = 0; i < cells.length; i++) {
          const c = cells[i];
          if (c.userHidden) {
            if (ghostMode && c.mesh.visible) {
              targets.push(c.mesh);
            }
            continue;
          }
          if (!c.revealed) {
            if (c.mesh.visible) targets.push(c.mesh);
          } else if (includeRevealed) {
            if (c.mesh.visible) targets.push(c.mesh);
            if (c.sprite && c.sprite.visible) targets.push(c.sprite);
          }
        }
        const hits = raycaster.intersectObjects(targets, false);
        return hits.length > 0 ? hits[0].object.userData.cell : null;
      }

      function updateHoverHighlight(clientX, clientY) {
        if (isPointerDown && draggedDistance > 5) {
          clearHover();
          return;
        }
        const wantHide = !gameOver && (hideMode || altKeyHeld);
        const hitCell = getIntersectedCell(clientX, clientY, wantHide);
        const coordPrefix = hitCell ? `XYZ: (${hitCell.x + 1}, ${hitCell.y + 1}, ${hitCell.z + 1})` : 'XYZ: –';

        if (hitCell === hoveredCell) {
          if (!hitCell) {
            elCoord.textContent = 'XYZ: –';
          } else if (hitCell.userHidden && ghostMode && !gameOver) {
            elCoord.textContent = `${coordPrefix} · 👻 Einblenden`;
          } else if (wantHide && !hitCell.userHidden && !gameOver) {
            elCoord.textContent = `${coordPrefix} · 👁️ Verbergen`;
          } else if (hitCell.flagged && gameLost) {
            elCoord.textContent = `${coordPrefix} · ${hitCell.isMine ? '✅ Mine' : '❌ Keine Mine'}`;
          } else {
            elCoord.textContent = coordPrefix;
          }
          return;
        }

        clearHover();
        if (hitCell && !gameOver && hitCell.userHidden && ghostMode) {
          hoveredCell = hitCell;
          hoveredPrevWireMat = hoveredCell.wireframe.material;
          hoveredCell.wireframe.material = lineMatGhostHover;
          elCoord.textContent = `${coordPrefix} · 👻 Einblenden`;
        } else if (hitCell && !gameOver && wantHide && !hitCell.userHidden) {
          hoveredCell = hitCell;
          if (hitCell.flagged) {
            hoveredPrevWireMat = hoveredCell.wireframe.material;
            hoveredCell.wireframe.material = lineMatGhostHover;
          } else if (hitCell.revealed && hitCell.sprite) {
            hitCell.sprite.scale.set(0.92, 0.92, 0.92);
          } else {
            hoveredPrevMeshMat = hoveredCell.mesh.material;
            hoveredCell.mesh.material = matHover;
          }
          elCoord.textContent = `${coordPrefix} · 👁️ Verbergen`;
        } else if (hitCell && !gameOver && !hitCell.revealed && !hitCell.flagged && !hitCell.userHidden) {
          hoveredCell = hitCell;
          hoveredPrevMeshMat = hoveredCell.mesh.material;
          hoveredCell.mesh.material = matHover;
          elCoord.textContent = coordPrefix;
        } else if (hitCell) {
          const suffix = (gameLost && hitCell.flagged) ? (hitCell.isMine ? ' · ✅ Mine' : ' · ❌ Keine Mine') : '';
          elCoord.textContent = `${coordPrefix}${suffix}`;
        } else {
          elCoord.textContent = 'XYZ: –';
        }
      }

      function clearHover() {
        if (hoveredCell) {
          if (hoveredPrevMeshMat !== null) {
            hoveredCell.mesh.material = hoveredPrevMeshMat;
          }
          if (hoveredPrevWireMat !== null) {
            hoveredCell.wireframe.material = hoveredPrevWireMat;
          }
          if (hoveredCell.revealed && !hoveredCell.isMine && hoveredCell.sprite) {
            hoveredCell.sprite.scale.set(0.76, 0.76, 0.76);
          }
        }
        hoveredCell = null;
        hoveredPrevMeshMat = null;
        hoveredPrevWireMat = null;
      }

      function getPinchDistance(t1, t2) {
        return Math.hypot(t1.clientX - t2.clientX, t1.clientY - t2.clientY);
      }

      // --- Desktop Mouse / Pen Pointer Controls ---
      container.addEventListener('pointerdown', (e) => {
        if (e.pointerType === 'touch') return;
        isPointerDown = true;
        activePointerId = e.pointerId;
        downButton = e.button;
        prevX = e.clientX;
        prevY = e.clientY;
        draggedDistance = 0;
        if (container.setPointerCapture) {
          try { container.setPointerCapture(e.pointerId); } catch (_) {}
        }
      });

      window.addEventListener('pointermove', (e) => {
        if (e.pointerType === 'touch') return;
        if (Boolean(e.altKey) !== altKeyHeld) {
          altKeyHeld = Boolean(e.altKey);
          if (container) {
            container.classList.toggle('hide-cursor', !gameOver && (hideMode || altKeyHeld) && !ghostMode);
          }
        }
        if (isPointerDown && e.pointerId === activePointerId) {
          const dx = e.clientX - prevX;
          const dy = e.clientY - prevY;
          prevX = e.clientX;
          prevY = e.clientY;
          draggedDistance += Math.hypot(dx, dy);

          if (draggedDistance > 4) {
            container.classList.add('dragging');
            clearHover();
            rotateCube(dx, dy, 0.0085);
          }
        }
        updateHoverHighlight(e.clientX, e.clientY);
      });

      function endMousePointer(e, allowClick) {
        if (e.pointerType === 'touch') return;
        if (!isPointerDown || e.pointerId !== activePointerId) return;
        isPointerDown = false;
        activePointerId = null;
        container.classList.remove('dragging');
        if (container.releasePointerCapture) {
          try { container.releasePointerCapture(e.pointerId); } catch (_) {}
        }

        if (allowClick && draggedDistance < 7) {
          const wantHide = !gameOver && (hideMode || e.altKey);
          const cell = getIntersectedCell(e.clientX, e.clientY, wantHide);
          if (cell) {
            if (cell.userHidden) {
              if (ghostMode && downButton === 0) {
                unhideCell(cell);
                updateHoverHighlight(e.clientX, e.clientY);
              }
            } else if (downButton === 2 || (!wantHide && (flagMode || e.shiftKey))) {
              if (!cell.revealed) toggleFlag(cell);
            } else if (downButton === 0) {
              if (wantHide) {
                hideCell(cell);
                updateHoverHighlight(e.clientX, e.clientY);
              } else if (!(e.detail >= 2 && (Date.now() - lastHideOpTime) < 450)) {
                revealCell(cell);
              }
            }
          }
        }
      }

      window.addEventListener('pointerup', (e) => endMousePointer(e, true));
      window.addEventListener('pointercancel', (e) => endMousePointer(e, false));

      // --- Mobile Touch Controls (1-Finger Rotate & 2-Finger Pinch Pull-Apart) ---
      container.addEventListener('touchstart', (e) => {
        e.preventDefault();
        clearHover();
        if (e.touches.length === 1) {
          touchMode = 'single';
          wasMultiTouch = false;
          touchPrevX = e.touches[0].clientX;
          touchPrevY = e.touches[0].clientY;
          touchDraggedDist = 0;
          prevPinchDist = null;
        }
      }, { passive: false });

      container.addEventListener('touchmove', (e) => {
        e.preventDefault();
        if (e.touches.length === 1 && touchMode === 'single') {
          const tx = e.touches[0].clientX;
          const ty = e.touches[0].clientY;
          const dx = tx - touchPrevX;
          const dy = ty - touchPrevY;
          touchPrevX = tx;
          touchPrevY = ty;
          touchDraggedDist += Math.hypot(dx, dy);

          if (touchDraggedDist > 3) {
            rotateCube(dx, dy, 0.0115);
          }
        }
      }, { passive: false });

      container.addEventListener('touchend', (e) => {
        e.preventDefault();
        if (e.touches.length === 0 && !wasMultiTouch && touchDraggedDist < 12) {
          const changed = e.changedTouches[0];
          if (changed) {
            const wantHide = !gameOver && hideMode;
            const cell = getIntersectedCell(changed.clientX, changed.clientY, wantHide);
            if (cell) {
              elCoord.textContent = `XYZ: (${cell.x + 1}, ${cell.y + 1}, ${cell.z + 1})`;
              if (cell.userHidden) {
                if (ghostMode) unhideCell(cell);
              } else if (wantHide) {
                hideCell(cell);
              } else if (flagMode) {
                toggleFlag(cell);
              } else {
                revealCell(cell);
              }
            }
          }
        }
      }, { passive: false });

      // Handle 2-finger pinch anywhere on screen & block browser page-zoom completely
      document.addEventListener('touchstart', (e) => {
        if (e.touches.length >= 2) {
          e.preventDefault();
          touchMode = 'pinch';
          wasMultiTouch = true;
          prevPinchDist = getPinchDistance(e.touches[0], e.touches[1]);
        }
      }, { passive: false });

      document.addEventListener('touchmove', (e) => {
        if (e.touches.length >= 2) {
          e.preventDefault();
          touchMode = 'pinch';
          wasMultiTouch = true;
          const dist = getPinchDistance(e.touches[0], e.touches[1]);
          if (prevPinchDist !== null) {
            const deltaDist = dist - prevPinchDist;
            const minDim = Math.max(320, Math.min(window.innerWidth, window.innerHeight));
            const spreadDelta = (deltaDist / minDim) * 3.8;
            setTargetSpread(targetSpread + spreadDelta);
          }
          prevPinchDist = dist;
        }
      }, { passive: false });

      document.addEventListener('touchend', (e) => {
        if (e.touches.length === 1) {
          prevPinchDist = null;
          touchMode = 'single';
          touchPrevX = e.touches[0].clientX;
          touchPrevY = e.touches[0].clientY;
        } else if (e.touches.length === 0) {
          prevPinchDist = null;
          touchMode = 'none';
          wasMultiTouch = false;
        }
      }, { passive: false });

      document.addEventListener('touchcancel', () => {
        prevPinchDist = null;
        touchMode = 'none';
        wasMultiTouch = false;
      }, { passive: false });

      ['gesturestart', 'gesturechange', 'gestureend'].forEach((evtName) => {
        document.addEventListener(evtName, (e) => e.preventDefault(), { passive: false });
      });

      container.addEventListener('contextmenu', (e) => e.preventDefault());

      // Mousewheel / Trackpad Pinch pulls the cube apart / pushes it back together
      function setTargetSpread(newVal) {
        targetSpread = Math.max(MIN_SPREAD, Math.min(MAX_SPREAD, newVal));
        elSpreadSlider.value = String(Math.round(targetSpread * 100));
        elSpreadLabel.textContent = targetSpread.toFixed(2) + '×';
      }

      window.addEventListener('wheel', (e) => {
        if (e.target && e.target.tagName === 'SELECT') return;
        e.preventDefault();
        let dy = e.deltaY;
        if (e.deltaMode === 1) dy *= 30;
        else if (e.deltaMode === 2) dy *= 300;

        if (e.ctrlKey) {
          // Trackpad pinch gesture: spreading fingers out produces negative deltaY
          setTargetSpread(targetSpread - dy * 0.015);
        } else {
          // Mouse wheel: smooth step scaled to deltaY
          const step = Math.max(-0.22, Math.min(0.22, dy * 0.0014));
          setTargetSpread(targetSpread + step);
        }
      }, { passive: false });

      elSpreadSlider.addEventListener('input', () => {
        const val = parseInt(elSpreadSlider.value, 10) / 100;
        setTargetSpread(val);
      });

      elResetViewBtn.addEventListener('click', () => {
        setTargetSpread(1.15);
      });

      // UI Controls
      elFlagBtn.addEventListener('click', () => {
        flagMode = !flagMode;
        if (flagMode && hideMode) {
          setHideMode(false);
        }
        elFlagBtn.classList.toggle('active-mode', flagMode);
        elFlagBtn.textContent = flagMode ? '🚩 Flaggen-Modus: AN' : '🚩 Flaggen-Modus: AUS';
      });

      if (elHideBtn) {
        elHideBtn.addEventListener('click', () => {
          if (gameOver) return;
          if (!hideMode) {
            hideBarDismissed = false;
            setHideMode(true);
          } else {
            setHideMode(false);
          }
        });
      }
      if (elHideUndoBtn) {
        elHideUndoBtn.addEventListener('click', undoHide);
      }
      if (elHideGhostBtn) {
        elHideGhostBtn.addEventListener('click', toggleGhostMode);
      }
      if (elHideRestoreBtn) {
        elHideRestoreBtn.addEventListener('click', () => restoreAllHidden(false));
      }
      if (elHideDoneBtn) {
        elHideDoneBtn.addEventListener('click', () => {
          hideBarDismissed = true;
          hideMode = false;
          ghostMode = false;
          clearHover();
          cells.forEach(c => {
            if (c.userHidden) setCellVisual(c);
          });
          syncHideUI();
        });
      }

      window.addEventListener('keydown', (e) => {
        if (document.querySelector('.arcade-modal-backdrop, #abm-drawer.open')) return;
        if (e.key === 'Alt') {
          if (!altKeyHeld) {
            altKeyHeld = true;
            syncHideUI();
          }
          return;
        }
        const tag = document.activeElement && document.activeElement.tagName;
        if (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT') return;

        if ((e.key === 'u' || e.key === 'U') && !e.ctrlKey && !e.metaKey && !e.altKey) {
          if (hiddenHistory.length > 0) {
            e.preventDefault();
            undoHide();
          }
          return;
        }
        if ((e.ctrlKey || e.metaKey) && !e.shiftKey && !e.altKey && e.key.toLowerCase() === 'z') {
          if (hiddenHistory.length > 0) {
            e.preventDefault();
            undoHide();
          }
          return;
        }
        if (e.key === 'h' || e.key === 'H') {
          if (e.ctrlKey || e.metaKey || e.altKey) return;
          e.preventDefault();
          if (e.shiftKey) {
            restoreAllHidden(false);
          } else {
            setHideMode(!hideMode);
          }
          return;
        }
        if ((e.key === 'g' || e.key === 'G') && !e.ctrlKey && !e.metaKey && !e.altKey) {
          if (hiddenCount > 0 || ghostMode) {
            e.preventDefault();
            toggleGhostMode();
          }
          return;
        }
        if (e.key === 'Escape' && (hideMode || ghostMode)) {
          e.preventDefault();
          hideMode = false;
          ghostMode = false;
          clearHover();
          cells.forEach(c => {
            if (c.userHidden) setCellVisual(c);
          });
          syncHideUI();
        }
      });

      window.addEventListener('keyup', (e) => {
        if (e.key === 'Alt' && altKeyHeld) {
          altKeyHeld = false;
          clearHover();
          syncHideUI();
        }
      });

      window.addEventListener('blur', () => {
        if (altKeyHeld) {
          altKeyHeld = false;
          clearHover();
          syncHideUI();
        }
      });

      elDifficulty.addEventListener('change', () => {
        elDifficulty.blur();
        initGame();
      });
      elNewGameBtn.addEventListener('click', initGame);
      elBannerRestart.addEventListener('click', initGame);

      window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
        updateCameraDistance();
        updateBannerPosition();
        updateHideBarPosition();
      });

      // Render Loop with smooth interpolation of the cube pull-apart factor
      function animate() {
        requestAnimationFrame(animate);

        if (Math.abs(currentSpread - targetSpread) > 0.001) {
          currentSpread += (targetSpread - currentSpread) * 0.18;
          for (let i = 0; i < cells.length; i++) {
            const c = cells[i];
            c.group.position.set(
              c.bx * currentSpread,
              c.by * currentSpread,
              c.bz * currentSpread
            );
          }
          updateCameraDistance();
        }

        renderer.render(scene, camera);
      }

      if (elThemeBtn) {
        elThemeBtn.addEventListener('click', () => {
          clearHover();
          applySceneTheme(isLightTheme() ? 'dark' : 'light');
        });
      }

      applySceneTheme(currentTheme);
      initGame();
      updateBannerPosition();
      updateHideBarPosition();
      animate();
    })();
  </script>
</body>
</html>
