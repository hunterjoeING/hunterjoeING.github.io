  <link rel="stylesheet" href="../../shared/arcade.css" />
  <style>
    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100dvh;
      max-height: 100dvh;
      overflow: hidden;
      overscroll-behavior: none;
    }

    body {
      display: flex;
      flex-direction: column;
    }

    .sol3d-viewport {
      position: relative;
      flex: 1 1 0;
      min-height: 0;
      width: 100%;
      overflow: hidden;
      background: #091611;
      touch-action: none;
    }

    canvas#sol3d-canvas {
      display: block;
      width: 100%;
      height: 100%;
      touch-action: none;
    }

    /* Minimal Dark-Glassmorphism HUD */
    .sol3d-hud-wrap {
      position: absolute;
      top: 10px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 25;
      width: min(960px, calc(100% - 20px));
      display: flex;
      flex-direction: column;
      align-items: center;
      pointer-events: none;
    }

    .sol3d-hud {
      pointer-events: auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 6px 10px;
      width: 100%;
      padding: 7px 12px;
      border-radius: 15px;
      background: rgba(12, 20, 17, 0.76);
      border: 1px solid rgba(226, 198, 132, 0.22);
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.42);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      color: #f5efe3;
      font-family: var(--font-ui);
      font-size: 12.5px;
    }

    html[data-theme="light"] .sol3d-hud {
      background: rgba(18, 28, 24, 0.80);
    }

    .hud-stats {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
    }

    .hud-pill {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 4px 10px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.07);
      border: 1px solid rgba(255, 255, 255, 0.10);
      font-variant-numeric: tabular-nums;
      color: #d6cfc0;
      font-size: 12px;
      font-weight: 500;
    }

    .hud-pill strong {
      color: #fff9ed;
      font-weight: 700;
    }

    .hud-controls {
      display: flex;
      align-items: center;
      gap: 5px;
      flex-wrap: wrap;
    }

    .hud-btn {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 6px 11px;
      border-radius: 10px;
      border: 1px solid rgba(255, 255, 255, 0.14);
      background: rgba(255, 255, 255, 0.08);
      color: #f7f1e5;
      font-family: var(--font-ui);
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s ease, border-color 0.2s ease, transform 0.15s ease, opacity 0.2s ease;
      white-space: nowrap;
    }

    .hud-btn:hover:not(:disabled) {
      background: rgba(222, 194, 128, 0.18);
      border-color: rgba(222, 194, 128, 0.5);
      transform: translateY(-1px);
    }

    .hud-btn:disabled {
      opacity: 0.4;
      cursor: default;
    }

    .hud-btn.active {
      background: rgba(212, 175, 95, 0.25);
      border-color: rgba(229, 196, 122, 0.68);
      color: #ffeab8;
    }

    .hud-btn.auto-btn {
      background: linear-gradient(135deg, rgba(212, 175, 95, 0.88), rgba(176, 134, 58, 0.92));
      border-color: rgba(255, 232, 178, 0.75);
      color: #161108;
      box-shadow: 0 4px 16px rgba(212, 175, 95, 0.35);
    }

    .hud-btn.hidden {
      display: none !important;
    }

    .draw-badge {
      padding: 1px 6px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.14);
      font-size: 10.5px;
      font-weight: 700;
      color: #f7e4b6;
    }

    /* Settings & New Game Popover */
    .sol3d-popover {
      pointer-events: auto;
      align-self: flex-end;
      margin-top: 8px;
      width: min(300px, calc(100vw - 24px));
      padding: 14px;
      border-radius: 15px;
      background: rgba(14, 22, 19, 0.92);
      border: 1px solid rgba(226, 198, 132, 0.28);
      box-shadow: 0 18px 42px rgba(0, 0, 0, 0.58);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      color: #f5efe3;
      display: flex;
      flex-direction: column;
      gap: 11px;
    }

    .sol3d-popover.hidden {
      display: none;
    }

    .pop-section-label {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: #c7bfa8;
      margin-bottom: 5px;
    }

    .pop-btn-col {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .pop-btn-row {
      display: flex;
      gap: 6px;
    }

    .pop-btn {
      flex: 1;
      padding: 8px 10px;
      border-radius: 10px;
      border: 1px solid rgba(255, 255, 255, 0.14);
      background: rgba(255, 255, 255, 0.07);
      color: #f7f1e5;
      font-family: var(--font-ui);
      font-size: 12.5px;
      font-weight: 600;
      cursor: pointer;
      text-align: left;
      transition: all 0.18s ease;
    }

    .pop-btn:hover {
      background: rgba(222, 194, 128, 0.2);
      border-color: rgba(222, 194, 128, 0.55);
    }

    .pop-btn.active {
      background: rgba(212, 175, 95, 0.28);
      border-color: rgba(229, 196, 122, 0.72);
      color: #ffeab8;
    }

    .felt-swatches {
      display: flex;
      gap: 6px;
    }

    .felt-swatch {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 7px 8px;
      border-radius: 10px;
      border: 1px solid rgba(255, 255, 255, 0.14);
      background: rgba(255, 255, 255, 0.06);
      color: #f4eee1;
      font-size: 11.5px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.18s ease;
    }

    .felt-swatch.active {
      border-color: #e6c67e;
      background: rgba(222, 194, 128, 0.2);
    }

    .swatch-dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      border: 1px solid rgba(255, 255, 255, 0.45);
      flex-shrink: 0;
    }

    /* Calming Garden Tips & Moments Card (Bottom-Left) */
    .garden-card {
      position: absolute;
      left: max(14px, env(safe-area-inset-left, 0px));
      bottom: max(14px, env(safe-area-inset-bottom, 0px));
      z-index: 20;
      width: min(355px, calc(100vw - 28px));
      padding: 12px 15px;
      border-radius: 15px;
      background: rgba(12, 22, 18, 0.80);
      border: 1px solid rgba(186, 206, 168, 0.24);
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.42);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      color: #f3ede1;
      transition: opacity 0.35s ease, transform 0.35s ease;
    }

    .garden-card.hidden-garden {
      opacity: 0;
      transform: translateY(10px);
      pointer-events: none;
    }

    .garden-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 6px;
    }

    .garden-season {
      font-size: 11.5px;
      font-weight: 700;
      letter-spacing: 0.03em;
      color: #bfd8aa;
      transition: opacity 0.42s ease;
    }

    .garden-next-btn {
      padding: 3px 9px;
      border-radius: 999px;
      border: 1px solid rgba(191, 216, 170, 0.28);
      background: rgba(255, 255, 255, 0.06);
      color: #d8e5cc;
      font-family: var(--font-ui);
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s ease, border-color 0.2s ease;
    }

    .garden-next-btn:hover {
      background: rgba(191, 216, 170, 0.18);
      border-color: rgba(191, 216, 170, 0.55);
    }

    .garden-text {
      margin: 0;
      font-size: 13.5px;
      line-height: 1.54;
      color: #f5efe3;
      min-height: 3.1em;
      transition: opacity 0.42s ease;
    }

    .garden-season.fading,
    .garden-text.fading {
      opacity: 0;
    }

    /* Compact Victory Banner (leaves tabletop & 3D waterfall visible) */
    .sol3d-win {
      position: absolute;
      top: 72px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 30;
      width: min(410px, calc(100% - 24px));
      padding: 20px 22px;
      border-radius: 18px;
      background: rgba(13, 22, 18, 0.88);
      border: 1px solid rgba(229, 196, 122, 0.45);
      box-shadow: 0 22px 54px rgba(0, 0, 0, 0.62);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      color: #f8f2e6;
      text-align: center;
      animation: editorialFadeIn 0.32s var(--ease-boutique);
    }

    .sol3d-win.hidden {
      display: none !important;
    }

    .win-title {
      margin: 0 0 10px;
      font-family: var(--font-serif);
      font-size: 22px;
      color: #ffe7a8;
    }

    .win-stats {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 6px;
      margin-bottom: 14px;
    }

    .win-stats > div {
      padding: 7px 6px;
      border-radius: 10px;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .win-stats span {
      display: block;
      font-size: 10.5px;
      color: #c2b8a3;
    }

    .win-stats strong {
      display: block;
      font-size: 14px;
      color: #fffaf0;
      margin-top: 2px;
    }

    .win-actions {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 8px;
    }

    @media (max-width: 720px) {
      .sol3d-hud-wrap {
        top: 6px;
        width: calc(100% - 12px);
      }
      .sol3d-hud {
        padding: 6px 8px;
        gap: 5px;
        border-radius: 12px;
      }
      .hud-pill {
        padding: 3px 8px;
        font-size: 11px;
      }
      .hud-btn {
        padding: 5px 8px;
        font-size: 11.5px;
      }
      .garden-card {
        left: 8px;
        right: 8px;
        bottom: max(8px, env(safe-area-inset-bottom, 0px));
        width: auto;
        padding: 9px 12px;
        border-radius: 12px;
      }
      .garden-text {
        font-size: 12.5px;
        line-height: 1.44;
        min-height: 0;
      }
      .win-stats {
        grid-template-columns: repeat(2, 1fr);
      }
    }
  </style>
</head>
<body>
  <header class="arcade-topbar">
    <div class="topbar-left">
      <a href="../../index.html" class="back-hub-btn">← Dashboard</a>
      <div class="topbar-title">🃏 3D Solitär · Klondike</div>
    </div>
    <div class="topbar-right">
      <span class="pill-stat">🏆 <span id="top-best">0</span></span>
      <button id="btn-mute" class="icon-btn" onclick="ArcadeAudio.toggleMute(this)" title="Ton AN/AUS">🔊</button>
    </div>
  </header>

  <main class="sol3d-viewport" id="sol3d-stage">
    <canvas id="sol3d-canvas" aria-label="3D Solitär Spieltisch"></canvas>

    <div class="sol3d-hud-wrap">
      <div class="sol3d-hud">
        <div class="hud-stats">
          <span class="hud-pill">⏱ <strong id="hud-time">00:00</strong></span>
          <span class="hud-pill">👣 <strong id="hud-moves">0</strong></span>
          <span class="hud-pill">⭐ <strong id="hud-score">0</strong></span>
        </div>

        <div class="hud-controls">
          <button type="button" id="btn-undo" class="hud-btn" title="Letzten Zug rückgängig (Strg+Z)">↩️ Zurück</button>
          <button type="button" id="btn-hint" class="hud-btn" title="Sinnvollen Zug anzeigen (H)">💡 Tipp</button>
          <button type="button" id="btn-auto" class="hud-btn auto-btn hidden" title="Alle übrigen Karten auf die Foundations legen">✨ Auto-Abschließen</button>
          <button type="button" id="btn-cam" class="hud-btn" title="Kamerawinkel wechseln">📐 Tisch-3D</button>
          <button type="button" id="btn-garden-toggle" class="hud-btn" title="Gartentipp-Kachel ein-/ausblenden">🌱 Gartentipp</button>
          <button type="button" id="btn-menu" class="hud-btn" title="Neues Spiel, Ziehmodus &amp; Tischfarbe">⚙️ Spiel <span class="draw-badge" id="hud-draw-badge">1er</span></button>
        </div>
      </div>

      <div id="sol3d-popover" class="sol3d-popover hidden" role="dialog" aria-label="Spiel-Einstellungen">
        <div>
          <div class="pop-section-label">Partie</div>
          <div class="pop-btn-col">
            <button type="button" id="menu-new-random" class="pop-btn">🃏 Neues Spiel (Zufällig)</button>
            <button type="button" id="menu-repeat-deal" class="pop-btn">🔁 Gleichen Deal wiederholen</button>
          </div>
        </div>
        <div>
          <div class="pop-section-label">Karten ziehen</div>
          <div class="pop-btn-row">
            <button type="button" id="menu-draw-1" class="pop-btn active">1 Karte</button>
            <button type="button" id="menu-draw-3" class="pop-btn">3 Karten</button>
          </div>
        </div>
        <div>
          <div class="pop-section-label">Spieltisch-Filz</div>
          <div class="felt-swatches">
            <button type="button" class="felt-swatch active" data-felt-theme="smaragd">
              <span class="swatch-dot" style="background:#195a41;"></span> Smaragd
            </button>
            <button type="button" class="felt-swatch" data-felt-theme="abendblau">
              <span class="swatch-dot" style="background:#1b3d63;"></span> Blau
            </button>
            <button type="button" class="felt-swatch" data-felt-theme="weinrot">
              <span class="swatch-dot" style="background:#611e2f;"></span> Weinrot
            </button>
          </div>
        </div>
      </div>
    </div>

    <aside id="garden-card" class="garden-card" aria-live="polite">
      <div class="garden-head">
        <span id="garden-season" class="garden-season">🍂 Herbst im Garten</span>
        <button type="button" id="btn-garden-next" class="garden-next-btn" title="Nächsten Gartenmoment anzeigen">→ Nächster</button>
      </div>
      <p id="garden-text" class="garden-text"></p>
    </aside>

    <div id="sol3d-win" class="sol3d-win hidden" role="dialog" aria-label="Spiel gewonnen">
      <h2 class="win-title">🏆 Wunderschön gelöst!</h2>
      <div id="win-stats" class="win-stats"></div>
      <div class="win-actions">
        <button type="button" id="btn-win-new" class="hud-btn auto-btn">🃏 Neues Spiel</button>
        <button type="button" id="btn-win-repeat" class="hud-btn">🔁 Gleicher Deal</button>
        <button type="button" id="btn-win-dismiss" class="hud-btn">👀 Wasserfall</button>
      </div>
    </div>
  </main>

  <script src="../../shared/arcade.js"></script>
  <script type="module" src="./sol3d-main.js"></script>
</body>
</html>
