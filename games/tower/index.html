<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Bastion TD – Neon Tower Defense</title>
  <link rel="stylesheet" href="../../shared/arcade.css">
  <style>
    html, body {
      min-height: 100%;
    }
    .td-shell {
      max-width: 1060px;
      margin: 0 auto;
      padding: 10px 10px calc(18px + env(safe-area-inset-bottom, 0px));
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .td-hud {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 10px 12px;
      border-radius: 12px;
      background: rgba(11, 20, 42, 0.9);
      border: 1px solid rgba(56, 189, 248, 0.35);
      font-family: var(--font-mono);
      font-size: 12.5px;
    }
    .td-stats {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      align-items: center;
    }
    .td-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      align-items: center;
    }
    .td-layout {
      display: grid;
      grid-template-columns: 1fr 270px;
      gap: 10px;
      align-items: start;
    }
    .td-board-wrap {
      position: relative;
      border-radius: 14px;
      overflow: hidden;
      border: 1px solid rgba(56, 189, 248, 0.4);
      background: #060d1f;
      aspect-ratio: 14 / 9;
      width: 100%;
      touch-action: manipulation;
    }
    canvas#tdCanvas {
      display: block;
      width: 100%;
      height: 100%;
      cursor: crosshair;
    }
    .td-panel {
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .tower-shop {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }
    .tower-btn {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 3px;
      padding: 9px;
      border-radius: 10px;
      background: rgba(15, 23, 42, 0.92);
      border: 1px solid rgba(148, 163, 184, 0.3);
      color: #f8fafc;
      text-align: left;
      cursor: pointer;
      transition: border-color 0.12s, background 0.12s;
    }
    .tower-btn.selected {
      border-color: #38bdf8;
      background: rgba(14, 116, 144, 0.35);
      box-shadow: 0 0 14px rgba(56, 189, 248, 0.25);
    }
    .tower-btn.cant-afford { opacity: 0.48; }
    .tower-name { font-size: 12.5px; font-weight: 800; }
    .tower-cost { font-family: var(--font-mono); font-size: 11.5px; color: #fbbf24; font-weight: 700; }
    .tower-desc { font-size: 10.5px; color: var(--text-muted); line-height: 1.25; }

    .inspector-box {
      padding: 10px;
      border-radius: 10px;
      background: rgba(15, 23, 42, 0.88);
      border: 1px solid rgba(56, 189, 248, 0.35);
      font-size: 12.5px;
    }
    .overlay-card {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      background: rgba(2, 6, 18, 0.78);
      backdrop-filter: blur(6px);
      z-index: 20;
      text-align: center;
    }
    .overlay-card.hidden { display: none !important; }
    select.map-sel {
      background: rgba(15, 23, 42, 0.95);
      color: #f8fafc;
      border: 1px solid rgba(56, 189, 248, 0.45);
      border-radius: 8px;
      padding: 5px 8px;
      font-size: 12px;
    }
    @media (max-width: 840px) {
      .td-layout { grid-template-columns: 1fr; }
      .tower-shop { grid-template-columns: repeat(4, 1fr); }
    }
    @media (max-width: 560px) {
      .tower-shop { grid-template-columns: 1fr 1fr; }
    }
  </style>
</head>
<body>
  <header class="arcade-topbar">
    <div class="topbar-left">
      <a href="../../index.html" class="back-hub-btn">← Dashboard</a>
      <div class="topbar-title">🏰 Bastion Tower Defense</div>
    </div>
    <div class="topbar-right">
      <span class="pill-stat">🏆 <span id="top-best">0</span></span>
      <button id="btn-mute" class="icon-btn" onclick="ArcadeAudio.toggleMute(this)" title="Ton AN/AUS">🔊</button>
    </div>
  </header>

  <div class="td-shell">
    <div class="td-hud">
      <div class="td-stats">
        <span>💰 Gold: <strong id="hud-gold" style="color:#fbbf24">150</strong></span>
        <span>❤️ Leben: <strong id="hud-lives" style="color:#fb7185">20</strong></span>
        <span>🌊 Welle: <strong id="hud-wave">0</strong></span>
        <span>⭐ Punkte: <strong id="hud-score">0</strong></span>
      </div>
      <div class="td-actions">
        <select id="map-sel" class="map-sel" onchange="resetTD(this.value)">
          <option value="0">🗺️ Cyber-Serpentinen</option>
          <option value="1">🗺️ Doppel-Schleife</option>
          <option value="2">🗺️ Spiral-Bastion</option>
        </select>
        <button id="btn-speed" class="secondary-btn" style="padding:5px 10px;font-size:12px;" onclick="toggleSpeed()">⏩ 1×</button>
        <button id="btn-wave" class="primary-btn" style="padding:6px 12px;font-size:12.5px;" onclick="sendNextWave()">▶ Welle starten</button>
        <button class="secondary-btn" style="padding:5px 10px;font-size:12px;" onclick="resetTD()">🔄 Neu</button>
      </div>
    </div>

    <div class="td-layout">
      <div class="td-board-wrap" id="tdStage">
        <canvas id="tdCanvas"></canvas>
        <div id="tdOverlay" class="overlay-card hidden">
          <div style="max-width:360px;">
            <div style="font-size:42px;" id="ov-emoji">💥</div>
            <h2 id="ov-title" style="margin:6px 0;">Basis gefallen!</h2>
            <p id="ov-desc" style="color:#cbd5e1;font-size:13.5px;"></p>
            <button class="primary-btn" onclick="resetTD()">🔄 Noch einmal verteidigen</button>
          </div>
        </div>
      </div>

      <aside class="glass-card td-panel">
        <div style="font-size:13px;font-weight:800;color:#7dd3fc;">🛠️ Türme bauen (Feld anklicken)</div>
        <div id="tower-shop" class="tower-shop"></div>
        <div id="inspector" class="inspector-box">
          <div style="color:var(--text-muted);font-size:12px;">
            Wähle oben einen Turm und klicke/tippe auf ein freies dunkles Gitterfeld neben dem Pfad — oder klicke auf einen gebauten Turm für <strong>Upgrade / Verkauf</strong>.
          </div>
        </div>
      </aside>
    </div>
  </div>

  <script src="../../shared/arcade.js"></script>
  <script>
    const COLS = 14, ROWS = 9;
    const canvas = document.getElementById('tdCanvas');
    const ctx = canvas.getContext('2d');
    const stage = document.getElementById('tdStage');

    const MAPS = [
      // Map 0: S-Curve
      [[0,1],[3,1],[3,4],[1,4],[1,7],[6,7],[6,2],[10,2],[10,6],[13,6]],
      // Map 1: Double Loop
      [[0,4],[2,4],[2,1],[6,1],[6,7],[10,7],[10,2],[12,2],[12,5],[13,5]],
      // Map 2: Spiral Inward
      [[0,0],[12,0],[12,8],[1,8],[1,2],[10,2],[10,6],[3,6],[3,4],[7,4]]
    ];

    const TOWER_TYPES = [
      { id: 'pulse', icon: '🔵', name: 'Puls-Turm', cost: 50, range: 2.5, rate: 2.6, dmg: 14, color: '#38bdf8', splash: 0, slow: 0, desc: 'Schnell & allround' },
      { id: 'frost', icon: '❄️', name: 'Frost-Prisma', cost: 75, range: 2.2, rate: 1.4, dmg: 8, color: '#a5f3fc', splash: 0, slow: 0.42, desc: 'Verlangsamt im Umkreis' },
      { id: 'mortar', icon: '💥', name: 'Plasma-Mörser', cost: 110, range: 3.0, rate: 0.75, dmg: 38, color: '#fb923c', splash: 1.35, slow: 0, desc: 'Flächenschaden' },
      { id: 'rail', icon: '⚡', name: 'Railgun', cost: 145, range: 4.5, rate: 0.55, dmg: 82, color: '#f472b6', splash: 0, slow: 0, desc: 'Extrem-Reichweite' }
    ];

    let mapIdx = 0;
    let pathCells = new Set();
    let waypoints = [];
    let selectedType = 'pulse';
    let selectedTower = null;
    let hoverTile = null;

    let gold = 150;
    let lives = 20;
    let wave = 0;
    let score = 0;
    let speedMult = 1;
    let waveQueue = [];
    let spawnCooldown = 0;
    let gameOver = false;

    let towers = [];
    let enemies = [];
    let projectiles = [];
    let beams = [];
    let particles = [];
    let currentRunId = ArcadeScores.newRunId('tower');

    function refreshTopBest() {
      const b = ArcadeScores.getBest('tower');
      document.getElementById('top-best').textContent = b ? b.best : 0;
    }

    function buildPathSet(idx) {
      const pts = MAPS[idx] || MAPS[0];
      waypoints = pts.map(([c, r]) => ({ x: c + 0.5, y: r + 0.5 }));
      pathCells.clear();
      for (let i = 0; i < pts.length - 1; i++) {
        let [c0, r0] = pts[i];
        const [c1, r1] = pts[i + 1];
        const dc = Math.sign(c1 - c0), dr = Math.sign(r1 - r0);
        pathCells.add(`${c0},${r0}`);
        while (c0 !== c1 || r0 !== r1) {
          c0 += dc;
          r0 += dr;
          pathCells.add(`${c0},${r0}`);
        }
      }
    }

    function resetTD(newMapIdx) {
      if (newMapIdx !== undefined) mapIdx = parseInt(newMapIdx, 10) || 0;
      currentRunId = ArcadeScores.newRunId('tower');
      buildPathSet(mapIdx);
      gold = 150;
      lives = 20;
      wave = 0;
      score = 0;
      waveQueue = [];
      towers = [];
      enemies = [];
      projectiles = [];
      beams = [];
      particles = [];
      selectedTower = null;
      gameOver = false;
      document.getElementById('tdOverlay').classList.add('hidden');
      renderShop();
      renderInspector();
      updateHUD();
      ArcadeAudio.click();
    }

    function toggleSpeed() {
      speedMult = speedMult === 1 ? 2 : 1;
      document.getElementById('btn-speed').textContent = `⏩ ${speedMult}×`;
      ArcadeAudio.click();
    }

    function sendNextWave() {
      if (gameOver) return;
      wave++;
      const count = 7 + wave * 3;
      const isBossWave = wave % 5 === 0;
      for (let i = 0; i < count; i++) {
        const fast = wave >= 2 && i % 4 === 2;
        const tank = wave >= 3 && i % 5 === 4;
        const baseHp = 28 + wave * 18 + Math.pow(wave, 1.45) * 4;
        waveQueue.push({
          hp: tank ? baseHp * 2.2 : (fast ? baseHp * 0.65 : baseHp),
          speed: fast ? 2.15 : (tank ? 0.9 : 1.35),
          reward: tank ? 16 : 9 + Math.floor(wave * 0.5),
          kind: tank ? 'tank' : (fast ? 'fast' : 'normal')
        });
      }
      if (isBossWave) {
        waveQueue.push({
          hp: (28 + wave * 20) * 6.5,
          speed: 0.72,
          reward: 65,
          kind: 'boss'
        });
      }
      spawnCooldown = 0.2;
      updateHUD();
      ArcadeAudio.pop();
    }

    function renderShop() {
      const wrap = document.getElementById('tower-shop');
      wrap.innerHTML = TOWER_TYPES.map(t => `
        <button type="button" class="tower-btn ${selectedType === t.id ? 'selected' : ''} ${gold < t.cost ? 'cant-afford' : ''}"
          onclick="selectShopTower('${t.id}')">
          <span class="tower-name">${t.icon} ${t.name}</span>
          <span class="tower-cost">💰 ${t.cost}</span>
          <span class="tower-desc">${t.desc}</span>
        </button>
      `).join('');
    }

    function selectShopTower(id) {
      selectedType = id;
      selectedTower = null;
      renderShop();
      renderInspector();
      ArcadeAudio.click();
    }

    function upgradeCost(tw) {
      return Math.round(tw.def.cost * (0.75 * tw.lvl));
    }

    function renderInspector() {
      const box = document.getElementById('inspector');
      if (!selectedTower) {
        const def = TOWER_TYPES.find(t => t.id === selectedType);
        box.innerHTML = `<div style="font-weight:700;color:#7dd3fc;">Ausgewählt: ${def.icon} ${def.name}</div>
          <div style="color:var(--text-muted);font-size:12px;margin-top:4px;">Tippe auf ein leeres Feld neben dem Pfad, um diesen Turm für ${def.cost} Gold zu bauen.</div>`;
        return;
      }
      const tw = selectedTower;
      const uCost = upgradeCost(tw);
      const sellVal = Math.round(tw.spent * 0.75);
      box.innerHTML = `
        <div style="display:flex;justify-content:space-between;align-items:center;">
          <strong>${tw.def.icon} ${tw.def.name} (Stufe ${tw.lvl}/3)</strong>
        </div>
        <div style="color:#94a3b8;font-size:11.5px;margin:6px 0;">
          Schaden: <b>${Math.round(tw.dmg)}</b> · Reichweite: <b>${tw.range.toFixed(1)}</b>
        </div>
        <div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:8px;">
          ${tw.lvl < 3 ? `<button class="primary-btn" style="padding:6px 10px;font-size:12px;" onclick="upgradeSelected()" ${gold < uCost ? 'disabled' : ''}>⬆ Upgrade (${uCost}💰)</button>` : '<span style="color:#4ade80;font-size:12px;font-weight:700;">★ Max-Stufe</span>'}
          <button class="secondary-btn" style="padding:6px 10px;font-size:12px;" onclick="sellSelected()">💸 Verkaufen (+${sellVal})</button>
        </div>
      `;
    }

    function upgradeSelected() {
      if (!selectedTower || selectedTower.lvl >= 3) return;
      const cost = upgradeCost(selectedTower);
      if (gold < cost) return;
      gold -= cost;
      selectedTower.spent += cost;
      selectedTower.lvl++;
      selectedTower.dmg *= 1.55;
      selectedTower.range += 0.35;
      selectedTower.rate *= 1.15;
      ArcadeAudio.perkGood();
      renderShop();
      renderInspector();
      updateHUD();
    }

    function sellSelected() {
      if (!selectedTower) return;
      const refund = Math.round(selectedTower.spent * 0.75);
      gold += refund;
      towers = towers.filter(t => t !== selectedTower);
      selectedTower = null;
      ArcadeAudio.pop();
      renderShop();
      renderInspector();
      updateHUD();
    }

    function updateHUD() {
      document.getElementById('hud-gold').textContent = gold;
      document.getElementById('hud-lives').textContent = lives;
      document.getElementById('hud-wave').textContent = wave;
      document.getElementById('hud-score').textContent = score;
      const waveBtn = document.getElementById('btn-wave');
      waveBtn.disabled = waveQueue.length > 0 || enemies.length > 0;
      waveBtn.textContent = waveQueue.length > 0 || enemies.length > 0 ? `🌊 Welle ${wave} läuft...` : `▶ Welle ${wave + 1} starten`;
      renderShop();
    }

    function tileFromClient(cx, cy) {
      const r = canvas.getBoundingClientRect();
      const col = Math.floor(((cx - r.left) / r.width) * COLS);
      const row = Math.floor(((cy - r.top) / r.height) * ROWS);
      if (col < 0 || col >= COLS || row < 0 || row >= ROWS) return null;
      return { col, row };
    }

    canvas.addEventListener('pointermove', (e) => {
      hoverTile = tileFromClient(e.clientX, e.clientY);
    });
    canvas.addEventListener('pointerleave', () => { hoverTile = null; });
    canvas.addEventListener('click', (e) => {
      if (gameOver) return;
      const tile = tileFromClient(e.clientX, e.clientY);
      if (!tile) return;

      const existing = towers.find(t => t.col === tile.col && t.row === tile.row);
      if (existing) {
        selectedTower = existing;
        renderInspector();
        ArcadeAudio.click();
        return;
      }

      if (pathCells.has(`${tile.col},${tile.row}`)) {
        selectedTower = null;
        renderInspector();
        return;
      }

      const def = TOWER_TYPES.find(t => t.id === selectedType);
      if (!def || gold < def.cost) {
        ArcadeAudio.perkBad();
        return;
      }
      gold -= def.cost;
      const newTw = {
        col: tile.col,
        row: tile.row,
        x: tile.col + 0.5,
        y: tile.row + 0.5,
        def,
        lvl: 1,
        spent: def.cost,
        dmg: def.dmg,
        range: def.range,
        rate: def.rate,
        cd: 0,
        angle: 0
      };
      towers.push(newTw);
      selectedTower = newTw;
      ArcadeAudio.pop();
      renderInspector();
      updateHUD();
    });

    function resize() {
      const r = stage.getBoundingClientRect();
      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      canvas.width = Math.max(320, Math.floor(r.width * dpr));
      canvas.height = Math.max(200, Math.floor(r.height * dpr));
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }
    window.addEventListener('resize', resize);
    resize();

    function stepTD(rawDt) {
      if (gameOver) return;
      const dt = rawDt * speedMult;

      if (waveQueue.length > 0) {
        spawnCooldown -= dt;
        if (spawnCooldown <= 0) {
          const tpl = waveQueue.shift();
          enemies.push({
            x: waypoints[0].x,
            y: waypoints[0].y,
            wp: 1,
            hp: tpl.hp,
            maxHp: tpl.hp,
            speed: tpl.speed,
            reward: tpl.reward,
            kind: tpl.kind,
            slowTimer: 0,
            progress: 0
          });
          spawnCooldown = 0.62;
        }
      }

      // Move enemies along waypoints
      for (let i = enemies.length - 1; i >= 0; i--) {
        const en = enemies[i];
        en.slowTimer = Math.max(0, en.slowTimer - dt);
        const spd = en.speed * (en.slowTimer > 0 ? 0.58 : 1);
        let rem = spd * dt;
        en.progress += rem;

        while (rem > 0 && en.wp < waypoints.length) {
          const tgt = waypoints[en.wp];
          const dx = tgt.x - en.x, dy = tgt.y - en.y;
          const dist = Math.hypot(dx, dy);
          if (dist <= rem) {
            en.x = tgt.x;
            en.y = tgt.y;
            en.wp++;
            rem -= dist;
          } else {
            en.x += (dx / dist) * rem;
            en.y += (dy / dist) * rem;
            rem = 0;
          }
        }
        if (en.wp >= waypoints.length) {
          enemies.splice(i, 1);
          lives = Math.max(0, lives - (en.kind === 'boss' ? 5 : 1));
          ArcadeAudio.perkBad();
          updateHUD();
          if (lives <= 0) {
            gameOver = true;
            ArcadeAudio.fail();
            const isNew = ArcadeScores.record('tower', score, `${score} Pkt (Welle ${wave})`, false, { runId: currentRunId });
            refreshTopBest();
            document.getElementById('ov-emoji').textContent = isNew ? '🏆' : '💥';
            document.getElementById('ov-title').textContent = isNew ? 'Neuer Bastion-Rekord!' : 'Basis überrannt!';
            document.getElementById('ov-desc').textContent = `Erreicht: Welle ${wave} · Gesamtpunkte: ${score}`;
            document.getElementById('tdOverlay').classList.remove('hidden');
            return;
          }
        }
      }

      // Towers target & fire
      towers.forEach(tw => {
        tw.cd = Math.max(0, tw.cd - dt);
        if (tw.cd > 0) return;

        // Pick furthest along path within range
        let best = null;
        enemies.forEach(en => {
          if (Math.hypot(en.x - tw.x, en.y - tw.y) <= tw.range) {
            if (!best || en.progress > best.progress) best = en;
          }
        });
        if (!best) return;
        tw.angle = Math.atan2(best.y - tw.y, best.x - tw.x);
        tw.cd = 1 / tw.rate;

        if (tw.def.id === 'frost') {
          enemies.forEach(en => {
            if (Math.hypot(en.x - tw.x, en.y - tw.y) <= tw.range) {
              en.hp -= tw.dmg;
              en.slowTimer = 2.0;
            }
          });
          particles.push({ x: tw.x, y: tw.y, maxR: tw.range, life: 0.25, color: '#a5f3fc', ring: true });
        } else if (tw.def.id === 'rail') {
          best.hp -= tw.dmg;
          beams.push({ x0: tw.x, y0: tw.y, x1: best.x, y1: best.y, life: 0.14, color: '#f472b6' });
          ArcadeAudio.laser();
        } else {
          projectiles.push({
            x: tw.x, y: tw.y, target: best, tx: best.x, ty: best.y,
            speed: 9.5, dmg: tw.dmg, splash: tw.def.splash, color: tw.def.color
          });
        }
      });

      // Projectiles
      for (let i = projectiles.length - 1; i >= 0; i--) {
        const pr = projectiles[i];
        if (pr.target && pr.target.hp > 0) { pr.tx = pr.target.x; pr.ty = pr.target.y; }
        const dx = pr.tx - pr.x, dy = pr.ty - pr.y;
        const dist = Math.hypot(dx, dy);
        if (dist < pr.speed * dt + 0.12) {
          if (pr.splash > 0) {
            enemies.forEach(en => {
              if (Math.hypot(en.x - pr.tx, en.y - pr.ty) <= pr.splash) en.hp -= pr.dmg;
            });
            particles.push({ x: pr.tx, y: pr.ty, maxR: pr.splash, life: 0.22, color: '#fb923c', ring: true });
          } else if (pr.target) {
            pr.target.hp -= pr.dmg;
          }
          projectiles.splice(i, 1);
        } else {
          pr.x += (dx / dist) * pr.speed * dt;
          pr.y += (dy / dist) * pr.speed * dt;
        }
      }

      // Enemy deaths
      let changedStats = false;
      for (let i = enemies.length - 1; i >= 0; i--) {
        const en = enemies[i];
        if (en.hp <= 0) {
          gold += en.reward;
          score += en.reward * 5;
          particles.push({ x: en.x, y: en.y, maxR: 0.45, life: 0.2, color: '#4ade80', ring: false });
          enemies.splice(i, 1);
          changedStats = true;
        }
      }
      if (waveQueue.length === 0 && enemies.length === 0 && wave > 0) {
        const prevBtnDisabled = document.getElementById('btn-wave').disabled;
        if (prevBtnDisabled) {
          ArcadeScores.record('tower', score, `${score} Pkt (Welle ${wave})`, false, { runId: currentRunId, silent: true });
          refreshTopBest();
          changedStats = true;
        }
      }
      if (changedStats) {
        updateHUD();
        renderInspector();
      }

      for (let i = beams.length - 1; i >= 0; i--) {
        beams[i].life -= dt;
        if (beams[i].life <= 0) beams.splice(i, 1);
      }
      for (let i = particles.length - 1; i >= 0; i--) {
        particles[i].life -= dt;
        if (particles[i].life <= 0) particles.splice(i, 1);
      }
    }

    function drawTD() {
      const r = stage.getBoundingClientRect();
      const w = r.width, h = r.height;
      const cw = w / COLS, ch = h / ROWS;
      const nowSec = performance.now() * 0.001;

      const bgGrad = ctx.createLinearGradient(0, 0, w, h);
      bgGrad.addColorStop(0, '#050b1b');
      bgGrad.addColorStop(1, '#091532');
      ctx.fillStyle = bgGrad;
      ctx.fillRect(0, 0, w, h);

      for (let row = 0; row < ROWS; row++) {
        for (let col = 0; col < COLS; col++) {
          const isPath = pathCells.has(`${col},${row}`);
          const x0 = col * cw, y0 = row * ch;
          if (!isPath) {
            ctx.fillStyle = (col + row) % 2 === 0 ? '#0c1936' : '#09142c';
            ctx.fillRect(x0 + 1, y0 + 1, cw - 2, ch - 2);
            ctx.fillStyle = 'rgba(56, 189, 248, 0.14)';
            ctx.fillRect(x0 + 4, y0 + 4, 2, 2);
            ctx.fillRect(x0 + cw - 6, y0 + ch - 6, 2, 2);
          } else {
            ctx.fillStyle = '#0f1f3d';
            ctx.fillRect(x0, y0, cw, ch);
          }
        }
      }

      if (hoverTile && !pathCells.has(`${hoverTile.col},${hoverTile.row}`) &&
          !towers.find(t => t.col === hoverTile.col && t.row === hoverTile.row)) {
        const def = TOWER_TYPES.find(t => t.id === selectedType);
        const canAff = gold >= def.cost;
        const hx = (hoverTile.col + 0.5) * cw, hy = (hoverTile.row + 0.5) * ch;
        ctx.fillStyle = canAff ? 'rgba(56, 189, 248, 0.16)' : 'rgba(244, 63, 94, 0.16)';
        ctx.fillRect(hoverTile.col * cw + 2, hoverTile.row * ch + 2, cw - 4, ch - 4);
        ctx.strokeStyle = canAff ? 'rgba(56, 189, 248, 0.55)' : 'rgba(244, 63, 94, 0.55)';
        ctx.lineWidth = 1.5;
        ctx.setLineDash([5, 5]);
        ctx.beginPath();
        ctx.arc(hx, hy, def.range * ((cw + ch) * 0.5), 0, Math.PI * 2);
        ctx.stroke();
        ctx.setLineDash([]);
      }

      ctx.save();
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';
      ctx.strokeStyle = 'rgba(14, 165, 233, 0.22)';
      ctx.lineWidth = Math.min(cw, ch) * 0.66;
      ctx.beginPath();
      waypoints.forEach((wp, i) => {
        if (i === 0) ctx.moveTo(wp.x * cw, wp.y * ch);
        else ctx.lineTo(wp.x * cw, wp.y * ch);
      });
      ctx.stroke();

      ctx.strokeStyle = '#1e293b';
      ctx.lineWidth = Math.min(cw, ch) * 0.52;
      ctx.stroke();

      ctx.strokeStyle = 'rgba(56, 189, 248, 0.45)';
      ctx.lineWidth = 2.5;
      ctx.setLineDash([10, 14]);
      ctx.lineDashOffset = -nowSec * 36;
      ctx.stroke();
      ctx.setLineDash([]);
      ctx.restore();

      const sPt = waypoints[0], ePt = waypoints[waypoints.length - 1];
      ctx.save();
      ctx.translate(sPt.x * cw, sPt.y * ch);
      const spG = ctx.createRadialGradient(0, 0, 2, 0, 0, cw * 0.42);
      spG.addColorStop(0, 'rgba(251, 113, 133, 0.72)');
      spG.addColorStop(1, 'rgba(251, 113, 133, 0)');
      ctx.fillStyle = spG;
      ctx.beginPath(); ctx.arc(0, 0, cw * 0.42, 0, Math.PI * 2); ctx.fill();
      ctx.rotate(nowSec * 1.4);
      ctx.strokeStyle = '#fb7185';
      ctx.lineWidth = 2.4;
      ctx.strokeRect(-cw * 0.27, -cw * 0.27, cw * 0.54, cw * 0.54);
      ctx.rotate(-nowSec * 2.6);
      ctx.strokeStyle = '#fda4af';
      ctx.lineWidth = 1.6;
      ctx.strokeRect(-cw * 0.16, -cw * 0.16, cw * 0.32, cw * 0.32);
      ctx.restore();

      ctx.save();
      ctx.translate(ePt.x * cw, ePt.y * ch);
      const coreG = ctx.createRadialGradient(0, 0, 2, 0, 0, cw * 0.48);
      coreG.addColorStop(0, 'rgba(74, 222, 128, 0.92)');
      coreG.addColorStop(0.55, 'rgba(34, 197, 94, 0.35)');
      coreG.addColorStop(1, 'rgba(74, 222, 128, 0)');
      ctx.fillStyle = coreG;
      ctx.beginPath();
      ctx.arc(0, 0, cw * 0.48, 0, Math.PI * 2);
      ctx.fill();
      ctx.rotate(-nowSec * 1.1);
      ctx.strokeStyle = '#4ade80';
      ctx.lineWidth = 2.5;
      ctx.beginPath();
      for (let i = 0; i < 6; i++) {
        const a = (i / 6) * Math.PI * 2;
        const rx = Math.cos(a) * cw * 0.3, ry = Math.sin(a) * cw * 0.3;
        if (i === 0) ctx.moveTo(rx, ry); else ctx.lineTo(rx, ry);
      }
      ctx.closePath();
      ctx.stroke();
      ctx.fillStyle = '#dcfce7';
      ctx.beginPath();
      ctx.arc(0, 0, cw * 0.11, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();

      towers.forEach(tw => {
        const tx = tw.x * cw, ty = tw.y * ch;
        const rad = Math.min(cw, ch) * 0.40;

        if (tw === selectedTower) {
          ctx.strokeStyle = 'rgba(56, 189, 248, 0.55)';
          ctx.lineWidth = 1.6;
          ctx.setLineDash([6, 4]);
          ctx.beginPath();
          ctx.arc(tx, ty, tw.range * ((cw + ch) * 0.5), 0, Math.PI * 2);
          ctx.stroke();
          ctx.setLineDash([]);
        }

        // Ground shadow & armored octal pad with gradient
        ctx.fillStyle = 'rgba(2, 6, 23, 0.55)';
        ctx.beginPath();
        ctx.arc(tx, ty + rad * 0.12, rad * 1.04, 0, Math.PI * 2);
        ctx.fill();

        const padGrad = ctx.createRadialGradient(tx - rad * 0.25, ty - rad * 0.25, 2, tx, ty, rad);
        padGrad.addColorStop(0, '#1e293b');
        padGrad.addColorStop(1, '#090f21');
        ctx.fillStyle = padGrad;
        ctx.strokeStyle = tw.def.color;
        ctx.lineWidth = 2.2;
        ctx.beginPath();
        for (let i = 0; i < 8; i++) {
          const a = (i / 8) * Math.PI * 2 + Math.PI / 8;
          const bx = tx + Math.cos(a) * rad;
          const by = ty + Math.sin(a) * rad;
          if (i === 0) ctx.moveTo(bx, by); else ctx.lineTo(bx, by);
        }
        ctx.closePath();
        ctx.fill();
        ctx.stroke();

        // Inner bearing ring + corner bolts
        ctx.strokeStyle = 'rgba(148, 163, 184, 0.3)';
        ctx.lineWidth = 1.1;
        ctx.beginPath();
        ctx.arc(tx, ty, rad * 0.68, 0, Math.PI * 2);
        ctx.stroke();

        ctx.save();
        ctx.translate(tx, ty);
        ctx.rotate(tw.angle);
        if (tw.def.id === 'frost') {
          ctx.rotate(nowSec * 1.8);
          const fg = ctx.createRadialGradient(0, 0, 1, 0, 0, rad * 0.85);
          fg.addColorStop(0, '#ecfeff');
          fg.addColorStop(0.5, '#67e8f9');
          fg.addColorStop(1, 'rgba(34, 211, 238, 0.12)');
          ctx.fillStyle = fg;
          ctx.beginPath();
          ctx.arc(0, 0, rad * 0.82, 0, Math.PI * 2);
          ctx.fill();
          ctx.fillStyle = '#a5f3fc';
          ctx.strokeStyle = '#0891b2';
          ctx.lineWidth = 1.2;
          ctx.beginPath();
          for (let i = 0; i < 12; i++) {
            const a = (i / 12) * Math.PI * 2;
            const cr = (i % 2 === 0 ? rad * 0.78 : rad * 0.34);
            if (i === 0) ctx.moveTo(Math.cos(a) * cr, Math.sin(a) * cr);
            else ctx.lineTo(Math.cos(a) * cr, Math.sin(a) * cr);
          }
          ctx.closePath();
          ctx.fill();
          ctx.stroke();
          ctx.fillStyle = '#ffffff';
          ctx.beginPath();
          ctx.arc(0, 0, rad * 0.24, 0, Math.PI * 2);
          ctx.fill();
        } else if (tw.def.id === 'mortar') {
          // Heavy armored siege cradle & dual vents
          ctx.fillStyle = '#334155';
          ctx.beginPath();
          ctx.roundRect(-rad * 0.56, -rad * 0.52, rad * 1.15, rad * 1.04, 4);
          ctx.fill();
          ctx.strokeStyle = '#fb923c';
          ctx.lineWidth = 1.2;
          ctx.stroke();
          // Heavy siege barrel + muzzle brake
          ctx.fillStyle = '#64748b';
          ctx.fillRect(0, -rad * 0.26, rad * 1.05, rad * 0.52);
          ctx.fillStyle = '#1e293b';
          ctx.fillRect(rad * 0.85, -rad * 0.34, rad * 0.28, rad * 0.68);
          ctx.fillStyle = '#fb923c';
          ctx.beginPath();
          ctx.arc(-rad * 0.12, 0, rad * 0.35, 0, Math.PI * 2);
          ctx.fill();
          ctx.fillStyle = '#fed7aa';
          ctx.beginPath();
          ctx.arc(-rad * 0.12, 0, rad * 0.16, 0, Math.PI * 2);
          ctx.fill();
        } else if (tw.def.id === 'rail') {
          // Split twin electromagnetic rail prongs + capacitor core
          ctx.fillStyle = '#334155';
          ctx.beginPath();
          ctx.arc(0, 0, rad * 0.52, 0, Math.PI * 2);
          ctx.fill();
          ctx.fillStyle = '#be185d';
          ctx.fillRect(-rad * 0.2, -rad * 0.36, rad * 1.45, rad * 0.20);
          ctx.fillRect(-rad * 0.2, rad * 0.16, rad * 1.45, rad * 0.20);
          ctx.fillStyle = '#f472b6';
          ctx.fillRect(rad * 0.1, -rad * 0.32, rad * 1.15, rad * 0.10);
          ctx.fillRect(rad * 0.1, rad * 0.22, rad * 1.15, rad * 0.10);
          ctx.fillStyle = '#fdf4ff';
          ctx.fillRect(rad * 0.2, -1.8, rad * 1.05, 3.6);
          ctx.fillStyle = '#f472b6';
          ctx.beginPath();
          ctx.arc(-rad * 0.08, 0, rad * 0.3, 0, Math.PI * 2);
          ctx.fill();
        } else {
          // Twin Pulse Cannon barrels + cooling fins + domed plasma turret
          ctx.fillStyle = '#1e293b';
          ctx.fillRect(-rad * 0.15, -rad * 0.38, rad * 0.7, rad * 0.76);
          ctx.fillStyle = '#38bdf8';
          ctx.fillRect(rad * 0.1, -rad * 0.30, rad * 0.98, rad * 0.18);
          ctx.fillRect(rad * 0.1, rad * 0.12, rad * 0.98, rad * 0.18);
          ctx.fillStyle = '#e0f2fe';
          ctx.fillRect(rad * 0.88, -rad * 0.30, rad * 0.2, rad * 0.18);
          ctx.fillRect(rad * 0.88, rad * 0.12, rad * 0.2, rad * 0.18);
          const dome = ctx.createRadialGradient(-rad * 0.1, -rad * 0.1, 1, 0, 0, rad * 0.44);
          dome.addColorStop(0, '#f0f9ff');
          dome.addColorStop(0.5, '#38bdf8');
          dome.addColorStop(1, '#0369a1');
          ctx.fillStyle = dome;
          ctx.beginPath();
          ctx.arc(0, 0, rad * 0.42, 0, Math.PI * 2);
          ctx.fill();
        }
        ctx.restore();

        for (let lv = 0; lv < tw.lvl; lv++) {
          const lx = tx - ((tw.lvl - 1) * 5) + lv * 10;
          const ly = ty + rad + 5.5;
          ctx.fillStyle = '#0f172a';
          ctx.beginPath(); ctx.arc(lx, ly, 3.6, 0, Math.PI * 2); ctx.fill();
          ctx.fillStyle = '#fbbf24';
          ctx.beginPath(); ctx.arc(lx, ly, 2.3, 0, Math.PI * 2); ctx.fill();
        }
      });

      enemies.forEach(en => {
        const ex = en.x * cw, ey = en.y * ch;
        const er = Math.min(cw, ch) * (en.kind === 'boss' ? 0.39 : en.kind === 'tank' ? 0.31 : 0.25);
        const tgt = waypoints[en.wp] || waypoints[waypoints.length - 1];
        const moveAng = tgt ? Math.atan2((tgt.y - en.y) * ch, (tgt.x - en.x) * cw) : 0;

        // Ground contact shadow
        ctx.fillStyle = 'rgba(2, 6, 23, 0.48)';
        ctx.beginPath();
        ctx.ellipse(ex, ey + er * 0.28, er * 0.95, er * 0.55, 0, 0, Math.PI * 2);
        ctx.fill();

        ctx.save();
        ctx.translate(ex, ey);
        ctx.rotate(moveAng);

        if (en.kind === 'boss') {
          // Twin heavy tracks + dreadnought battleship hull + reactor core + horns
          ctx.fillStyle = '#0f172a';
          ctx.fillRect(-er * 0.95, -er * 0.92, er * 1.9, er * 0.34);
          ctx.fillRect(-er * 0.95, er * 0.58, er * 1.9, er * 0.34);
          const hullG = ctx.createLinearGradient(-er, 0, er, 0);
          hullG.addColorStop(0, '#881337');
          hullG.addColorStop(0.6, '#e11d48');
          hullG.addColorStop(1, '#fb7185');
          ctx.fillStyle = hullG;
          ctx.beginPath();
          ctx.moveTo(er * 1.12, 0);
          ctx.lineTo(er * 0.45, -er * 0.72);
          ctx.lineTo(-er * 0.95, -er * 0.72);
          ctx.lineTo(-er * 0.75, 0);
          ctx.lineTo(-er * 0.95, er * 0.72);
          ctx.lineTo(er * 0.45, er * 0.72);
          ctx.closePath();
          ctx.fill();
          ctx.strokeStyle = '#fecdd3';
          ctx.lineWidth = 1.4;
          ctx.stroke();
          // Gold reactor core & turret twin cannons
          ctx.fillStyle = '#fbbf24';
          ctx.beginPath(); ctx.arc(-er * 0.08, 0, er * 0.32, 0, Math.PI * 2); ctx.fill();
          ctx.fillStyle = '#fef9c3';
          ctx.beginPath(); ctx.arc(-er * 0.08, 0, er * 0.15, 0, Math.PI * 2); ctx.fill();
          ctx.fillStyle = '#1e293b';
          ctx.fillRect(er * 0.18, -er * 0.25, er * 0.85, er * 0.14);
          ctx.fillRect(er * 0.18, er * 0.11, er * 0.85, er * 0.14);
        } else if (en.kind === 'tank') {
          // Armored caterpillar tracks + bronze glacis + rotating cupola
          ctx.fillStyle = '#1e293b';
          ctx.fillRect(-er * 0.95, -er * 0.88, er * 1.9, er * 0.30);
          ctx.fillRect(-er * 0.95, er * 0.58, er * 1.9, er * 0.30);
          const tHull = ctx.createLinearGradient(-er, -er, er, er);
          tHull.addColorStop(0, '#92400e');
          tHull.addColorStop(0.55, '#f59e0b');
          tHull.addColorStop(1, '#fbbf24');
          ctx.fillStyle = tHull;
          ctx.beginPath();
          ctx.roundRect(-er * 0.85, -er * 0.65, er * 1.7, er * 1.3, 4);
          ctx.fill();
          ctx.strokeStyle = '#fef3c7';
          ctx.lineWidth = 1.1;
          ctx.stroke();
          ctx.fillStyle = '#451a03';
          ctx.fillRect(0, -er * 0.15, er * 1.15, er * 0.30);
          ctx.fillStyle = '#fde68a';
          ctx.beginPath(); ctx.arc(-er * 0.1, 0, er * 0.34, 0, Math.PI * 2); ctx.fill();
        } else if (en.kind === 'fast') {
          // Sleek swept interceptor dart + twin violet engine flames
          ctx.fillStyle = 'rgba(232, 121, 249, 0.72)';
          ctx.beginPath();
          ctx.moveTo(-er * 0.65, -er * 0.25); ctx.lineTo(-er * 1.25, 0); ctx.lineTo(-er * 0.65, er * 0.25);
          ctx.closePath(); ctx.fill();
          const fG = ctx.createLinearGradient(-er, 0, er, 0);
          fG.addColorStop(0, '#7e22ce');
          fG.addColorStop(1, '#d8b4fe');
          ctx.fillStyle = fG;
          ctx.beginPath();
          ctx.moveTo(er * 1.18, 0);
          ctx.lineTo(-er * 0.55, -er * 0.82);
          ctx.lineTo(-er * 0.25, 0);
          ctx.lineTo(-er * 0.55, er * 0.82);
          ctx.closePath();
          ctx.fill();
          ctx.fillStyle = '#a5f3fc';
          ctx.beginPath(); ctx.ellipse(er * 0.22, 0, er * 0.34, er * 0.18, 0, 0, Math.PI * 2); ctx.fill();
        } else {
          // Stealth crimson raider drone with wing vents & optic core
          ctx.fillStyle = 'rgba(251, 146, 60, 0.75)';
          ctx.beginPath();
          ctx.arc(-er * 0.55, 0, er * 0.26, 0, Math.PI * 2);
          ctx.fill();
          const nG = ctx.createLinearGradient(-er, -er, er, er);
          nG.addColorStop(0, '#be123c');
          nG.addColorStop(1, '#fda4af');
          ctx.fillStyle = nG;
          ctx.beginPath();
          ctx.moveTo(er * 1.05, 0);
          ctx.lineTo(-er * 0.72, -er * 0.88);
          ctx.lineTo(-er * 0.40, 0);
          ctx.lineTo(-er * 0.72, er * 0.88);
          ctx.closePath();
          ctx.fill();
          ctx.strokeStyle = 'rgba(255,255,255,0.45)';
          ctx.lineWidth = 1;
          ctx.stroke();
          ctx.fillStyle = '#e0f2fe';
          ctx.beginPath(); ctx.arc(er * 0.2, 0, er * 0.25, 0, Math.PI * 2); ctx.fill();
        }

        if (en.slowTimer > 0) {
          ctx.strokeStyle = '#67e8f9';
          ctx.lineWidth = 2;
          ctx.beginPath();
          ctx.arc(0, 0, er * 1.15, 0, Math.PI * 2);
          ctx.stroke();
        }
        ctx.restore();

        const bw = er * 2.35;
        ctx.fillStyle = 'rgba(2, 6, 23, 0.88)';
        ctx.fillRect(ex - bw * 0.5 - 1, ey - er - 11, bw + 2, 6);
        ctx.fillStyle = en.kind === 'boss' ? '#fbbf24' : '#4ade80';
        ctx.fillRect(ex - bw * 0.5, ey - er - 10, bw * Math.max(0, en.hp / en.maxHp), 4);
      });

      projectiles.forEach(pr => {
        const px = pr.x * cw, py = pr.y * ch;
        ctx.fillStyle = pr.color;
        ctx.globalAlpha = 0.35;
        ctx.beginPath(); ctx.arc(px, py, 8, 0, Math.PI * 2); ctx.fill();
        ctx.globalAlpha = 1;
        ctx.beginPath(); ctx.arc(px, py, 4.2, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = '#ffffff';
        ctx.beginPath(); ctx.arc(px, py, 1.9, 0, Math.PI * 2); ctx.fill();
      });

      beams.forEach(b => {
        ctx.save();
        ctx.globalAlpha = Math.max(0, b.life / 0.14);
        ctx.strokeStyle = b.color;
        ctx.shadowColor = b.color;
        ctx.shadowBlur = 12;
        ctx.lineWidth = 4.5;
        ctx.beginPath();
        ctx.moveTo(b.x0 * cw, b.y0 * ch);
        ctx.lineTo(b.x1 * cw, b.y1 * ch);
        ctx.stroke();
        ctx.strokeStyle = '#ffffff';
        ctx.lineWidth = 1.6;
        ctx.stroke();
        ctx.restore();
      });

      particles.forEach(p => {
        const a = Math.max(0, p.life / 0.25);
        ctx.save();
        ctx.globalAlpha = a;
        if (p.ring) {
          ctx.strokeStyle = p.color;
          ctx.lineWidth = 2.6 * a;
          ctx.beginPath();
          ctx.arc(p.x * cw, p.y * ch, p.maxR * ((cw + ch) * 0.5) * (1.05 - a * 0.45), 0, Math.PI * 2);
          ctx.stroke();
        } else {
          ctx.fillStyle = p.color;
          ctx.beginPath();
          ctx.arc(p.x * cw, p.y * ch, p.maxR * cw * (1.2 - a), 0, Math.PI * 2);
          ctx.fill();
        }
        ctx.restore();
      });
    }
    let last = performance.now();
    function loop(now) {
      const dt = Math.min(0.05, (now - last) / 1000);
      last = now;
      stepTD(dt);
      drawTD();
      requestAnimationFrame(loop);
    }

    ArcadeAudio.syncButton(document.getElementById('btn-mute'));
    refreshTopBest();
    resetTD(0);
    requestAnimationFrame(loop);
  </script>
</body>
</html>
