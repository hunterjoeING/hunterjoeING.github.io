  <style>

    .tile-inner {
      position: relative;
      width: 100%;
      height: 100%;

      align-items: center;
      justify-content: center;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.22);

    .tile.is-new .tile-inner {

    @keyframes tilePopIn {
      0% { transform: scale(0.35); opacity: 0.2; }
      100% { transform: scale(1); opacity: 1; }

    @keyframes tileMergePop {

    .dpad-btn {

    html[data-theme="light"] .toolbar-2048 {

  <script src="../../shared/arcade.js"></script>
  <script>
    (function () {
      let size = 4;
      let grid = [];
      let score = 0;
      let bestScore = (ArcadeScores.getBest('p2048') && ArcadeScores.getBest('p2048').best) || 0;
      let currentRunId = ArcadeScores.newRunId('p2048');
      let nextTileId = 1;
      let undoStack = [];
      let reached2048 = false;
      let gameOver = false;

      const elScore = document.getElementById('pill-score');
      const elBest = document.getElementById('pill-best');
      const elMute = document.getElementById('btn-mute');
      const elStage = document.getElementById('board-stage');
      const elGridBg = document.getElementById('grid-bg');
      const elTileLayer = document.getElementById('tile-layer');
      const elUndo = document.getElementById('btn-undo');
      const elOverlay = document.getElementById('overlay');
      const elOvTitle = document.getElementById('ov-title');
      const elOvDesc = document.getElementById('ov-desc');
      const elOvContinue = document.getElementById('ov-continue');

      ArcadeAudio.syncButton(elMute);
      elMute.addEventListener('click', () => ArcadeAudio.toggleMute(elMute));

      function buildEmptyGrid(n) {
        return Array.from({ length: n }, () => Array(n).fill(null));
      }

      function cloneGrid(g) {
        return g.map(row => row.map(cell => (cell ? { id: cell.id, val: cell.val } : null)));
      }

      function maxTileVal() {
        let m = 0;
        for (let r = 0; r < size; r++) {
          for (let c = 0; c < size; c++) {
            if (grid[r][c] && grid[r][c].val > m) m = grid[r][c].val;
          }
        }
        return m;
      }

      function updateBest() {
        if (score > bestScore) {
          bestScore = score;
          ArcadeScores.record('p2048', bestScore, bestScore + ' Pkt (' + maxTileVal() + ')', false, { sync: false });
        }
        elScore.textContent = '⭐ ' + score;
        elBest.textContent = '🏆 ' + bestScore;
      }

      window.addEventListener('arcade:scores-updated', () => {
        const b = ArcadeScores.getBest('p2048');
        if (b && b.best > bestScore) {
          bestScore = b.best;
          elBest.textContent = '🏆 ' + bestScore;
        }
      });

      function initBoard() {
        currentRunId = ArcadeScores.newRunId('p2048');
        const b = ArcadeScores.getBest('p2048');
        if (b && b.best > bestScore) bestScore = b.best;
        elGridBg.style.gridTemplateColumns = `repeat(${size}, 1fr)`;
        elGridBg.style.gridTemplateRows = `repeat(${size}, 1fr)`;
        elGridBg.innerHTML = '';
        for (let i = 0; i < size * size; i++) {
          const cell = document.createElement('div');
          cell.className = 'grid-cell';
          elGridBg.appendChild(cell);
        }

        grid = buildEmptyGrid(size);
        score = 0;
        undoStack = [];
        reached2048 = false;
        gameOver = false;
        elOverlay.classList.remove('open');

        spawnTile();
        spawnTile();
        renderTiles();
        updateBest();
        elUndo.disabled = true;
      }

      function spawnTile() {
        const empty = [];
        for (let r = 0; r < size; r++) {
          for (let c = 0; c < size; c++) {
            if (!grid[r][c]) empty.push([r, c]);
          }
        }
        if (!empty.length) return false;
        const [r, c] = empty[Math.floor(Math.random() * empty.length)];
        grid[r][c] = { id: nextTileId++, val: Math.random() < 0.9 ? 2 : 4, isNew: true };
        return true;
      }

      function slideLine(line) {
        const items = line.filter(Boolean);
        const out = [];
        let gained = 0;
        let merged = false;

        for (let i = 0; i < items.length; i++) {
          const cur = items[i];
          const nxt = items[i + 1];
          if (nxt && cur.val === nxt.val) {
            const newVal = cur.val * 2;
            gained += newVal;
            out.push({ id: cur.id, val: newVal, isMerged: true });
            merged = true;
            i++;
          } else {
            out.push({ id: cur.id, val: cur.val });
          }
        }
        while (out.length < size) out.push(null);
        return { out, gained, merged };
      }

      function move(dir) {
        if (gameOver || elOverlay.classList.contains('open')) return;

        const prevSnap = { grid: cloneGrid(grid), score };
        let moved = false;
        let totalGain = 0;
        let anyMerge = false;
        const next = buildEmptyGrid(size);

        const getLine = (idx) => {
          const arr = [];
          for (let i = 0; i < size; i++) {
            if (dir === 'left') arr.push(grid[idx][i]);
            else if (dir === 'right') arr.push(grid[idx][size - 1 - i]);
            else if (dir === 'up') arr.push(grid[i][idx]);
            else if (dir === 'down') arr.push(grid[size - 1 - i][idx]);
          }
          return arr;
        };

        const setLine = (idx, arr) => {
          for (let i = 0; i < size; i++) {
            const item = arr[i];
            if (dir === 'left') next[idx][i] = item;
            else if (dir === 'right') next[idx][size - 1 - i] = item;
            else if (dir === 'up') next[i][idx] = item;
            else if (dir === 'down') next[size - 1 - i][idx] = item;
          }
        };

        for (let idx = 0; idx < size; idx++) {
          const before = getLine(idx);
          const res = slideLine(before);
          setLine(idx, res.out);
          totalGain += res.gained;
          if (res.merged) anyMerge = true;

          for (let i = 0; i < size; i++) {
            const b = before[i];
            const a = res.out[i];
            if ((b === null) !== (a === null) || (b && a && (b.val !== a.val || b.id !== a.id))) {
              moved = true;
            }
          }
        }

        if (!moved) return;

        undoStack.push(prevSnap);
        if (undoStack.length > 35) undoStack.shift();
        elUndo.disabled = false;

        grid = next;
        score += totalGain;
        spawnTile();
        updateBest();
        renderTiles();

        if (anyMerge) ArcadeAudio.pop();
        else ArcadeAudio.cardFlip();

        const isLightTheme = () => window.ArcadeTheme && ArcadeTheme.isLight();
        if (!reached2048 && maxTileVal() >= 2048) {
          reached2048 = true;
          ArcadeAudio.win();
          ArcadeScores.record('p2048', score, score + ' Pkt (2048!)', false, { runId: currentRunId });
          elOvTitle.textContent = '🎉 2048 erreicht!';
          elOvTitle.dataset.kind = 'win';
          elOvTitle.style.color = isLightTheme() ? '#b45309' : '#fbbf24';
          elOvDesc.textContent = 'Du kannst endlos weiterspielen oder eine neue Runde starten.';
          elOvContinue.style.display = 'inline-flex';
          elOverlay.classList.add('open');
          return;
        }

        if (!hasMoves()) {
          gameOver = true;
          ArcadeAudio.fail();
          ArcadeScores.record('p2048', score, score + ' Pkt (' + maxTileVal() + ')', false, { runId: currentRunId });
          elOvTitle.textContent = '💥 Keine Züge mehr';
          elOvTitle.dataset.kind = 'lose';
          elOvTitle.style.color = isLightTheme() ? '#be123c' : '#fb7185';
          elOvDesc.textContent = `Endstand: ${score} Punkte · Höchstes Prisma: ${maxTileVal()}`;
          elOvContinue.style.display = 'none';
          elOverlay.classList.add('open');
        }
      }

      function hasMoves() {
        for (let r = 0; r < size; r++) {
          for (let c = 0; c < size; c++) {
            const cur = grid[r][c];
            if (!cur) return true;
            if (r + 1 < size && grid[r + 1][c] && grid[r + 1][c].val === cur.val) return true;
            if (c + 1 < size && grid[r][c + 1] && grid[r][c + 1].val === cur.val) return true;
          }
        }
        return false;
      }

      const fxCanvas = document.getElementById('fx-canvas');
      const fxCtx = fxCanvas ? fxCanvas.getContext('2d') : null;
      let fxParts = [];
      let fxRaf = null;
      const FX_PALETTE = {
        4: '#38bdf8', 8: '#2dd4bf', 16: '#34d399', 32: '#facc15',
        64: '#fb923c', 128: '#f43f5e', 256: '#c084fc', 512: '#a855f7',
        1024: '#818cf8', 2048: '#fde047'
      };
      function spawnMergeFx(cx, cy, val) {
        if (!fxCanvas || !fxCtx) return;
        const rect = elTileLayer.getBoundingClientRect();
        if (fxCanvas.width !== Math.round(rect.width) || fxCanvas.height !== Math.round(rect.height)) {
          fxCanvas.width = Math.max(1, Math.round(rect.width));
          fxCanvas.height = Math.max(1, Math.round(rect.height));
        }
        const clr = FX_PALETTE[val] || '#22d3ee';
        const cnt = val >= 256 ? 18 : 10;
        for (let i = 0; i < cnt; i++) {
          const ang = (i / cnt) * Math.PI * 2 + Math.random() * 0.4;
          const spd = 65 + Math.random() * 145;
          fxParts.push({
            x: cx, y: cy,
            vx: Math.cos(ang) * spd,
            vy: Math.sin(ang) * spd,
            size: 2.5 + Math.random() * 3.5,
            life: 0.42 + Math.random() * 0.22,
            maxLife: 0.64,
            color: clr
          });
        }
        fxParts.push({ ring: true, x: cx, y: cy, r: 8, maxR: val >= 256 ? 68 : 48, life: 0.34, maxLife: 0.34, color: clr });
        if (!fxRaf) {
          let lastT = performance.now();
          const tick = (now) => {
            const dt = Math.min(0.05, (now - lastT) / 1000);
            lastT = now;
            fxCtx.clearRect(0, 0, fxCanvas.width, fxCanvas.height);
            for (let i = fxParts.length - 1; i >= 0; i--) {
              const p = fxParts[i];
              p.life -= dt;
              if (p.life <= 0) { fxParts.splice(i, 1); continue; }
              const a = p.life / p.maxLife;
              fxCtx.globalAlpha = a;
              if (p.ring) {
                const rad = p.r + (1 - a) * p.maxR;
                fxCtx.strokeStyle = p.color;
                fxCtx.lineWidth = 2.5 * a;
                fxCtx.beginPath();
                fxCtx.arc(p.x, p.y, rad, 0, Math.PI * 2);
                fxCtx.stroke();
              } else {
                p.x += p.vx * dt;
                p.y += p.vy * dt;
                p.vx *= 0.92;
                p.vy *= 0.92;
                fxCtx.fillStyle = p.color;
                fxCtx.beginPath();
                fxCtx.arc(p.x, p.y, p.size * a, 0, Math.PI * 2);
                fxCtx.fill();
              }
            }
            fxCtx.globalAlpha = 1;
            if (fxParts.length > 0) fxRaf = requestAnimationFrame(tick);
            else fxRaf = null;
          };
          fxRaf = requestAnimationFrame(tick);
        }
      }

      function renderTiles() {
        const layerW = elTileLayer.clientWidth;
        const gap = 10;
        const cellSize = (layerW - gap * (size - 1)) / size;

        // Track active ids so existing tiles glide smoothly to new coords
        const seenIds = new Set();
        for (let r = 0; r < size; r++) {
          for (let c = 0; c < size; c++) {
            const cell = grid[r][c];
            if (!cell) continue;
            seenIds.add(String(cell.id));

            let tileEl = elTileLayer.querySelector(`[data-tid="${cell.id}"]`);
            if (!tileEl) {
              tileEl = document.createElement('div');
              tileEl.dataset.tid = cell.id;
              tileEl.innerHTML = '<div class="tile-inner"></div>';
              elTileLayer.appendChild(tileEl);
            }

            const clsVal = cell.val <= 2048 ? 't-' + cell.val : 't-super';
            tileEl.className = 'tile ' + clsVal + (cell.isNew ? ' is-new' : '') + (cell.isMerged ? ' is-merged' : '');
            tileEl.style.width = cellSize + 'px';
            tileEl.style.height = cellSize + 'px';
            const tx = c * (cellSize + gap);
            const ty = r * (cellSize + gap);
            tileEl.style.transform = `translate3d(${tx}px, ${ty}px, 0)`;

            const inner = tileEl.querySelector('.tile-inner');
            inner.textContent = cell.val;
            const digits = String(cell.val).length;
            const baseFont = cellSize * (digits <= 2 ? 0.44 : digits === 3 ? 0.36 : 0.28);
            inner.style.fontSize = Math.round(baseFont) + 'px';

            if (cell.isMerged) {
              spawnMergeFx(tx + cellSize * 0.5, ty + cellSize * 0.5, cell.val);
            }
            delete cell.isNew;
            delete cell.isMerged;
          }
        }

        // Remove disappeared tiles (consumed in merge or undo)
        Array.from(elTileLayer.children).forEach(el => {
          if (!seenIds.has(el.dataset.tid)) el.remove();
        });
      }

      function undo() {
        if (!undoStack.length) return;
        const snap = undoStack.pop();
        grid = snap.grid;
        score = snap.score;
        gameOver = false;
        elOverlay.classList.remove('open');
        elUndo.disabled = undoStack.length === 0;
        updateBest();
        renderTiles();
        ArcadeAudio.click();
      }

      // Keyboard
      window.addEventListener('keydown', (e) => {
        const tag = e.target && e.target.tagName;
        if (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT') return;
        if (document.querySelector('.arcade-modal-backdrop, #abm-drawer.open')) return;
        const k = e.key.toLowerCase();
        if (k === 'arrowleft' || k === 'a') { e.preventDefault(); move('left'); }
        else if (k === 'arrowright' || k === 'd') { e.preventDefault(); move('right'); }
        else if (k === 'arrowup' || k === 'w') { e.preventDefault(); move('up'); }
        else if (k === 'arrowdown' || k === 's') { e.preventDefault(); move('down'); }
        else if (k === 'z' && (e.ctrlKey || e.metaKey)) { e.preventDefault(); undo(); }
      });

      // Touch / Pointer Swipe on stage
      let swipeStart = null;
      elStage.addEventListener('pointerdown', (e) => {
        swipeStart = { x: e.clientX, y: e.clientY };
      });
      window.addEventListener('pointerup', (e) => {
        if (!swipeStart) return;
        const dx = e.clientX - swipeStart.x;
        const dy = e.clientY - swipeStart.y;
        swipeStart = null;
        if (Math.hypot(dx, dy) < 24) return;
        if (Math.abs(dx) > Math.abs(dy)) move(dx > 0 ? 'right' : 'left');
        else move(dy > 0 ? 'down' : 'up');
      });
      window.addEventListener('pointercancel', () => {
        swipeStart = null;
      });

      document.querySelectorAll('.dpad-btn').forEach(btn => {
        btn.addEventListener('click', () => move(btn.dataset.dir));
      });

      document.getElementById('btn-undo').addEventListener('click', undo);
      document.getElementById('btn-new').addEventListener('click', () => {
        ArcadeAudio.click();
        initBoard();
      });
      document.getElementById('ov-restart').addEventListener('click', () => {
        ArcadeAudio.click();
        initBoard();
      });
      document.getElementById('ov-continue').addEventListener('click', () => {
        ArcadeAudio.click();
        elOverlay.classList.remove('open');
      });

      const b4 = document.getElementById('btn-size-4');
      const b5 = document.getElementById('btn-size-5');
      b4.addEventListener('click', () => {
        if (size === 4) return;
        size = 4;
        b4.classList.add('active');
        b5.classList.remove('active');
        ArcadeAudio.click();
        initBoard();
      });
      b5.addEventListener('click', () => {
        if (size === 5) return;
        size = 5;
        b5.classList.add('active');
        b4.classList.remove('active');
        ArcadeAudio.click();
        initBoard();
      });

      window.addEventListener('arcade:theme-changed', () => {
        if (!elOverlay.classList.contains('open')) return;
        const light = !!(window.ArcadeTheme && ArcadeTheme.isLight());
        if (elOvTitle.dataset.kind === 'win') {
          elOvTitle.style.color = light ? '#b45309' : '#fbbf24';
        } else if (elOvTitle.dataset.kind === 'lose') {
          elOvTitle.style.color = light ? '#be123c' : '#fb7185';
        }
      });

      window.addEventListener('resize', renderTiles);
      initBoard();
    })();
  </script>
</body>
</html>
